<meta charset="utf-8">
<title>WGYMADNSPORT · Pantalla de Ingresos</title>
<meta name="description" content="Pantalla en vivo de ingresos por tarjeta virtual, WGYMADNSPORT Tocopilla.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
 --negro:#0A0A0A;
 --surface:#161616;
 --surface-2:#1F1F1F;
 --card:#1c1c1c;
 --rojo:#E30613;
 --rojo-oscuro:#A40410;
 --dorado:#D4AF37;
 --blanco:#FFFFFF;
 --gris:#CFCFCF;
 --gris-soft:#8C8C8C;
 --line:#2A2A2A;
}
*{box-sizing:border-box;}
body{
 margin:0;
 background:var(--negro);
 color:var(--blanco);
 font-family:'Segoe UI', Arial, sans-serif;
 min-height:100vh;
}
header.top{ background:linear-gradient(180deg,#111 0%, var(--negro) 100%); border-bottom:3px solid var(--rojo); padding:22px 20px; text-align:center; }
header.top .logo{ width:56px; height:56px; border-radius:50%; object-fit:cover; border:2px solid var(--dorado); margin-bottom:8px; }
header.top .gymname{ font-size:13px; font-weight:800; letter-spacing:.14em; color:var(--dorado); text-transform:uppercase; margin:0 0 4px; }
header.top h1{ font-size:22px; margin:0; font-weight:800; text-transform:uppercase; }
header.top h1 span{ color:var(--rojo); }

.wrap{ max-width:720px; margin:0 auto; padding:26px 20px 60px; }

.hero{
 background:linear-gradient(135deg, #161616 0%, #0A0A0A 60%, #1c1608 100%);
 border:1.5px solid var(--dorado);
 border-radius:20px;
 padding:36px 28px;
 text-align:center;
 min-height:180px;
 display:flex; flex-direction:column; align-items:center; justify-content:center;
 transition:box-shadow .3s ease;
}
.hero.flash{ box-shadow:0 0 0 4px var(--rojo), 0 0 40px 6px rgba(227,6,19,.5); }
.hero .kicker{ font-size:12px; font-weight:800; letter-spacing:.16em; color:var(--dorado); text-transform:uppercase; margin:0 0 12px; }
.hero .name{ font-size:38px; font-weight:900; text-transform:uppercase; line-height:1.15; margin:0 0 8px; }
.hero .time{ font-size:15px; color:var(--gris-soft); font-weight:600; }
.hero .venc{ font-size:14px; font-weight:700; margin-top:10px; padding:5px 14px; border-radius:999px; display:inline-block; }
.hero .venc.good{ color:#5CA85C; background:rgba(92,168,92,.12); }
.hero .venc.warn{ color:var(--dorado); background:rgba(212,175,55,.12); }
.hero .venc.danger{ color:#E85C5C; background:rgba(232,92,92,.12); }
.hero .empty{ font-size:16px; color:var(--gris-soft); font-weight:600; }
.hero .fallo{ font-size:26px; font-weight:900; text-transform:uppercase; letter-spacing:.02em;
 line-height:1.1; margin:0 0 10px; text-wrap:balance; }
.hero .plan{ font-size:13px; color:var(--gris-soft); font-weight:600; margin:6px 0 0; }
.hero[data-v="ok"]{ border-color:#5CA85C; }
.hero[data-v="ok"] .fallo{ color:#5CA85C; }
.hero[data-v="ok"].flash{ box-shadow:0 0 0 4px #5CA85C, 0 0 40px 6px rgba(92,168,92,.45); }
.hero[data-v="warn"]{ border-color:var(--dorado); }
.hero[data-v="warn"] .fallo{ color:var(--dorado); }
.hero[data-v="warn"].flash{ box-shadow:0 0 0 4px var(--dorado), 0 0 40px 6px rgba(212,175,55,.45); }
.hero[data-v="bad"]{ border-color:#E85C5C; }
.hero[data-v="bad"] .fallo{ color:#E85C5C; }
.hero[data-v="bad"].flash{ box-shadow:0 0 0 4px var(--rojo), 0 0 40px 8px rgba(227,6,19,.55); }
.hero[data-v="nadie"]{ border-color:var(--line); }
.hero[data-v="nadie"] .fallo{ color:var(--gris-soft); font-size:20px; }
@media (max-width:520px){ .hero .name{ font-size:30px; } .hero .fallo{ font-size:21px; } }

.feed-head{ display:flex; align-items:center; justify-content:space-between; margin:28px 0 10px; }
.feed-head h2{ font-size:13px; font-weight:800; letter-spacing:.1em; color:var(--gris-soft); text-transform:uppercase; margin:0; }
.feed-head .dot-status{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--gris-soft); font-weight:600; }
.dot-live{ width:8px; height:8px; border-radius:50%; background:#5CA85C; }

.feed-item{
 display:flex; align-items:center; justify-content:space-between;
 background:var(--card); border:1px solid var(--line); border-radius:12px;
 padding:14px 16px; margin-bottom:8px;
}
.feed-item .fname{ font-weight:800; font-size:15px; letter-spacing:.01em; }
.feed-item .finfo{ display:flex; align-items:baseline; gap:10px; }
.feed-item .fvenc{ font-size:12px; font-weight:700; }
.feed-item .fvenc.good{ color:#5CA85C; }
.feed-item .fvenc.warn{ color:var(--dorado); }
.feed-item .fvenc.danger{ color:#E85C5C; }
.feed-item .ftime{ font-size:12.5px; color:var(--gris-soft); font-weight:600; }
.feed-empty{ text-align:center; color:var(--gris-soft); font-size:13.5px; padding:30px 0; }

.setup-notice{
 background:rgba(212,175,55,.1); border:1.5px solid var(--dorado); border-radius:12px;
 padding:16px 18px; font-size:13px; color:var(--gris); line-height:1.6; margin-bottom:24px;
}
.setup-notice b{ color:var(--dorado); }
</style>

<header class="top">
<img class="logo" id="topLogoImg" alt="WGYMADNSPORT">
<p class="gymname">WGYMADNSPORT Tocopilla</p>
<h1>Pantalla de <span>Ingresos</span></h1>
</header>

<div class="wrap">
<div id="setupNotice" class="setup-notice" hidden>
Esta pantalla todavía no está conectada. Falta pegar el link del check-in (te lo pido cuando termines de publicar el Apps Script).
</div>

<div class="hero" id="hero">
<p class="kicker">Último ingreso</p>
<p class="empty" id="heroEmpty">Esperando el primer escaneo del día...</p>
<p class="fallo" id="heroFallo" hidden></p>
<p class="name" id="heroName" hidden></p>
<p class="time" id="heroTime" hidden></p>
<p class="venc" id="heroVenc" hidden></p>
<p class="plan" id="heroPlan" hidden></p>
</div>

<div class="feed-head">
<h2>Ingresos recientes</h2>
<span class="dot-status"><span class="dot-live"></span> En vivo · <span id="origenLista">—</span></span>
</div>
<div id="feed"></div>
</div>

<script>
const LOGO_B64 = "assets/logo.jpg";
/* Tu planilla de socios. La pantalla NO lleva la lista: pregunta por cada
   persona que llega, una por una. */
const LISTA_URL = "https://script.google.com/macros/s/AKfycbz_P-2KuCZtyTWMOtcCpJXZw0vh1zKWK2fLrqtZ_PZjvL9haDHnPKQeNV7WdpnS7_68DA/exec";
const CHECKIN_URL = "https://script.google.com/macros/s/AKfycbzDpqUW70UbZTQtH8X20EDdAGdQQbxBoKebYg2eDwX42A3yCXEpKacpnjtp8RjkBcNq/exec";
</script>
<script>
(function(){
"use strict";

/* ── nombres ─────────────────────────────────────────────────────────── */
function sinTildes(s){
 return String(s == null ? "" : s).toUpperCase().normalize("NFD")
  .replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim();
}
function escapeHtml(s){
 return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; });
}
function fmtHora(ts){
 var d = new Date(ts);
 return d.toLocaleTimeString("es-CL", { hour:"2-digit", minute:"2-digit" });
}
function fechaCL(v){ return String(v || ""); }
function diasPara(v){
 var p = String(v || "").split("-");
 if(p.length !== 3) return null;
 var f = new Date(+p[2], +p[1]-1, +p[0]);
 f.setHours(0,0,0,0);
 if(isNaN(f)) return null;
 var h = new Date(); h.setHours(0,0,0,0);
 return Math.round((f - h) / 86400000);
}

/* ── le pregunta a la planilla por una sola persona ───────────────────── */
var cache = {}, pidiendo = {}, conectado = false;

function consultarSocio(nombre, apellido, cuando){
 var k = sinTildes(nombre) + "|" + sinTildes(apellido);
 var g = cache[k];
 if(g && (Date.now() - g.cuando) < 90000){ cuando(g.socio, true); return; }
 if(pidiendo[k]){ pidiendo[k].push(cuando); return; }   /* ya se está preguntando: espera */
 pidiendo[k] = [cuando];
 var cb = "wgymYo_" + Date.now() + "_" + Math.floor(Math.random()*1000);
 var tag = document.createElement("script");
 var hecho = false;
 var corte = setTimeout(function(){ fin(null); }, 10000);
 function fin(d){
  if(hecho) return;
  hecho = true;
  clearTimeout(corte);
  var avisar = pidiendo[k] || [];
  delete pidiendo[k];
  try{ delete window[cb]; }catch(e){}
  if(tag.parentNode) tag.remove();
  var socio, sabemos;
  if(d && d.ok){
   conectado = true;
   socio = d.existe ? { n:d.socio.n, a:d.socio.a, plan:d.socio.plan, v:d.socio.v } : null;
   sabemos = true;
   cache[k] = { socio:socio, cuando:Date.now() };
  }else{
   conectado = false;
   socio = g ? g.socio : null;
   sabemos = !!g;
  }
  pintarConexion();
  /* Le contesta a todos los que preguntaron por esta persona. */
  for(var i = 0; i < avisar.length; i++) avisar[i](socio, sabemos);
 }
 window[cb] = fin;
 tag.onerror = function(){ fin(null); };
 tag.src = LISTA_URL + "?action=consultar&callback=" + cb +
           "&n=" + encodeURIComponent(nombre) + "&a=" + encodeURIComponent(apellido) +
           "&_=" + Date.now();
 document.body.appendChild(tag);
}
function pintarConexion(){
 var el = document.getElementById("origenLista");
 if(el) el.textContent = conectado ? "conectado a la planilla" : "sin conexión a la planilla";
}

/* ── ¿puede pasar? ───────────────────────────────────────────────────── */
function veredicto(s, sabemos){
 if(!sabemos) return { v:"nadie", fallo:"No pude verificar",
  detalle:"Revísalo en el mesón", corto:"Sin conexión", cls:"", plan:"" };
 if(!s) return { v:"nadie", fallo:"No está en la lista de socios",
  detalle:"Agrégalo en el mesón", corto:"Sin ficha de socio", cls:"", plan:"" };
 var dias = diasPara(s.v);
 if(dias === null) return { v:"nadie", fallo:"Ficha sin fecha de vencimiento",
  detalle:"Revísale la fecha en el mesón", corto:"Sin fecha", cls:"", plan:s.plan };
 if(dias < 0) return { v:"bad", fallo:"Acceso denegado · membresía vencida",
  detalle:"Venció el " + fechaCL(s.v) + " · hace " + Math.abs(dias) + (Math.abs(dias)===1?" día":" días"),
  corto:null, cls:"danger", plan:s.plan };
 if(dias <= 5) return { v:"warn", fallo:"Pasa, pero avísale",
  detalle: dias === 0 ? "Vence hoy" : "Vence el " + fechaCL(s.v) + " · quedan " + dias + (dias===1?" día":" días"),
  corto:null, cls:"warn", plan:s.plan };
 return { v:"ok", fallo:"Acceso permitido",
  detalle:"Vence el " + fechaCL(s.v) + " · quedan " + dias + " días",
  corto:null, cls:"good", plan:s.plan };
}

/* ── el recuadro grande ──────────────────────────────────────────────── */
function showHero(r){
 consultarSocio(r.nombre, r.apellido, function(s, sabemos){ pintarHero(r, s, sabemos); });
}
function pintarHero(r, s, sabemos){
 var d = veredicto(s, sabemos);
 document.getElementById("heroEmpty").hidden = true;
 document.getElementById("hero").setAttribute("data-v", d.v);
 var f = document.getElementById("heroFallo"); f.hidden = false; f.textContent = d.fallo;
 var n = document.getElementById("heroName"); n.hidden = false;
 n.textContent = r.nombre + " " + r.apellido;
 var t = document.getElementById("heroTime"); t.hidden = false; t.textContent = fmtHora(r.ts);
 var ve = document.getElementById("heroVenc");
 if(d.detalle){ ve.hidden = false; ve.textContent = d.detalle; ve.className = "venc " + d.cls; }
 else { ve.hidden = true; }
 var pl = document.getElementById("heroPlan");
 if(d.plan){ pl.hidden = false; pl.textContent = d.plan; } else { pl.hidden = true; }
}
function flashHero(r){
 showHero(r);
 var hero = document.getElementById("hero");
 hero.classList.remove("flash");
 void hero.offsetWidth;
 hero.classList.add("flash");
}

/* ── los ingresos recientes ──────────────────────────────────────────── */
var ultimasFilas = [];

function renderFeed(rows){
 var feed = document.getElementById("feed");
 if(!rows.length){
  feed.innerHTML = '<div class="feed-empty">Todavía no hay ingresos registrados.</div>';
  return;
 }
 feed.innerHTML = "";
 rows.forEach(function(r){
  var div = document.createElement("div");
  div.className = "feed-item";
  div.innerHTML = '<span class="finfo"><span class="fname">' +
   escapeHtml(r.nombre + " " + r.apellido) + '</span><span class="fvenc"></span></span>' +
   '<span class="ftime">' + fmtHora(r.ts) + '</span>';
  feed.appendChild(div);
  consultarSocio(r.nombre, r.apellido, function(s, sabemos){
   var d = veredicto(s, sabemos);
   var nota = div.querySelector(".fvenc");
   nota.textContent = d.corto || d.detalle;
   nota.className = "fvenc " + d.cls;
  });
 });
}

/* ── el registro en vivo del QR (el mismo de siempre) ─────────────────── */
var vistos = {}, primeraVuelta = true;
function llaveDe(r){ return r.ts + "|" + r.nombre + "|" + r.apellido; }

function handleData(data){
 var rows = data.rows || [];
 ultimasFilas = rows;
 if(rows.length){
  var ultima = rows[0];
  if(!primeraVuelta && !vistos[llaveDe(ultima)]){
   /* llegó alguien nuevo: pregunta de nuevo por si lo renovaron recién */
   delete cache[sinTildes(ultima.nombre) + "|" + sinTildes(ultima.apellido)];
   flashHero(ultima);
  }else if(primeraVuelta){
   showHero(ultima);
  }
 }
 rows.forEach(function(r){ vistos[llaveDe(r)] = true; });
 primeraVuelta = false;
 renderFeed(rows);
}

var nPoll = 0;
function poll(){
 if(!CHECKIN_URL) return;
 nPoll++;
 var cb = "wgymCb" + nPoll + "_" + Date.now();
 var tag = document.createElement("script");
 window[cb] = function(data){
  try{ handleData(data); }catch(e){}
  delete window[cb];
  tag.remove();
 };
 tag.src = CHECKIN_URL + "?callback=" + cb + "&_=" + Date.now();
 tag.onerror = function(){ delete window[cb]; tag.remove(); };
 document.body.appendChild(tag);
}

document.getElementById("topLogoImg").src = LOGO_B64;
pintarConexion();
poll();
setInterval(poll, 4000);
/* Cada tanto olvida lo guardado, para tomar las renovaciones del mesón. */
setInterval(function(){ cache = {}; renderFeed(ultimasFilas); }, 90000);
})();
</script>
