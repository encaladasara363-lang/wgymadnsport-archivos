<style>
:root{
 --negro:#0A0A0A;
 --surface:#161616;
 --surface-2:#1F1F1F;
 --card:#1c1c1c;
 --rojo:#E30613;
 --rojo-oscuro:#A40410;
 --dorado:#D4AF37;
 --blanco:#FFFFFF;
 --gris:#CFCFCF;
 --gris-soft:#8C8C8C;
 --line:#2A2A2A;
}
*{box-sizing:border-box;}
body{
 margin:0;
 background:var(--negro);
 color:var(--blanco);
 font-family:'Segoe UI', Arial, sans-serif;
 min-height:100vh;
}
header.top{ background:linear-gradient(180deg,#111 0%, var(--negro) 100%); border-bottom:3px solid var(--rojo); padding:22px 20px; text-align:center; }
header.top .logo{ width:56px; height:56px; border-radius:50%; object-fit:cover; border:2px solid var(--dorado); margin-bottom:8px; }
header.top .gymname{ font-size:13px; font-weight:800; letter-spacing:.14em; color:var(--dorado); text-transform:uppercase; margin:0 0 4px; }
header.top h1{ font-size:22px; margin:0; font-weight:800; text-transform:uppercase; }
header.top h1 span{ color:var(--rojo); }

.wrap{ max-width:720px; margin:0 auto; padding:26px 20px 60px; }

.hero{
 background:linear-gradient(135deg, #161616 0%, #0A0A0A 60%, #1c1608 100%);
 border:1.5px solid var(--dorado);
 border-radius:20px;
 padding:36px 28px;
 text-align:center;
 min-height:180px;
 display:flex; flex-direction:column; align-items:center; justify-content:center;
 transition:box-shadow .3s ease;
}
.hero.flash{ box-shadow:0 0 0 4px var(--rojo), 0 0 40px 6px rgba(227,6,19,.5); }
.hero .kicker{ font-size:12px; font-weight:800; letter-spacing:.16em; color:var(--dorado); text-transform:uppercase; margin:0 0 12px; }
.hero .name{ font-size:38px; font-weight:900; text-transform:uppercase; line-height:1.15; margin:0 0 8px; }
.hero .time{ font-size:15px; color:var(--gris-soft); font-weight:600; }
.hero .venc{ font-size:24px; font-weight:800; margin-top:10px; padding:8px 20px; border-radius:999px; display:inline-block; }
.hero .venc.good{ color:#5CA85C; background:rgba(92,168,92,.12); }
.hero .venc.warn{ color:var(--dorado); background:rgba(212,175,55,.12); }
.hero .venc.danger{ color:#E85C5C; background:rgba(232,92,92,.12); }
.hero .empty{ font-size:16px; color:var(--gris-soft); font-weight:600; }
.hero .fallo{ font-size:26px; font-weight:900; text-transform:uppercase; letter-spacing:.02em;
 line-height:1.1; margin:0 0 10px; text-wrap:balance; }
.hero .plan{ font-size:20px; color:var(--gris-soft); font-weight:700; margin:10px 0 0; }
.hero .turno{ margin-top:8px; font-size:24px; font-weight:800; letter-spacing:.02em;
 display:inline-block; padding:8px 20px; border-radius:999px; border:1px solid; }
.hero .turno[data-t="ok"]{ color:#5CA85C; border-color:#5CA85C; background:rgba(92,168,92,.12); }
.hero .turno[data-t="tope"]{ color:var(--dorado); border-color:var(--dorado); background:rgba(212,175,55,.14); }
.hero[data-v="ok"]{ border-color:#5CA85C; }
.hero[data-v="ok"] .fallo{ color:#5CA85C; }
.hero[data-v="ok"].flash{ box-shadow:0 0 0 4px #5CA85C, 0 0 40px 6px rgba(92,168,92,.45); }
.hero[data-v="warn"]{ border-color:var(--dorado); }
.hero[data-v="warn"] .fallo{ color:var(--dorado); }
.hero[data-v="warn"].flash{ box-shadow:0 0 0 4px var(--dorado), 0 0 40px 6px rgba(212,175,55,.45); }
.hero[data-v="bad"]{ border-color:#E85C5C; }
.hero[data-v="bad"] .fallo{ color:#E85C5C; }
.hero[data-v="bad"].flash{ box-shadow:0 0 0 4px var(--rojo), 0 0 40px 8px rgba(227,6,19,.55); }
.hero[data-v="nadie"]{ border-color:var(--line); }
.hero[data-v="nadie"] .fallo{ color:var(--gris-soft); font-size:20px; }
@media (max-width:520px){ .hero .name{ font-size:30px; } .hero .fallo{ font-size:21px; }
 .hero .venc{ font-size:19px; padding:7px 16px; } .hero .turno{ font-size:19px; padding:7px 16px; }
 .hero .plan{ font-size:17px; } }

.feed-head{ display:flex; align-items:center; justify-content:space-between; margin:28px 0 10px; }
.feed-head h2{ font-size:13px; font-weight:800; letter-spacing:.1em; color:var(--gris-soft); text-transform:uppercase; margin:0; }
.feed-head .dot-status{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--gris-soft); font-weight:600; }
.dot-live{ width:8px; height:8px; border-radius:50%; background:#5CA85C; }

.feed-item{
 display:flex; align-items:center; justify-content:space-between;
 background:var(--card); border:1px solid var(--line); border-radius:12px;
 padding:14px 16px; margin-bottom:8px;
}
.feed-item .fname{ font-weight:800; font-size:15px; letter-spacing:.01em; }
.feed-item .finfo{ display:flex; align-items:baseline; gap:10px; }
.feed-item .fvenc{ font-size:12px; font-weight:700; }
.feed-item .fvenc.good{ color:#5CA85C; }
.feed-item .fvenc.warn{ color:var(--dorado); }
.feed-item .fvenc.danger{ color:#E85C5C; }
.feed-item .fveces{ font-size:11.5px; font-weight:800; padding:3px 9px; border-radius:999px;
 border:1px solid rgba(212,175,55,.6); color:var(--dorado); background:rgba(212,175,55,.12);
 white-space:nowrap; }
.feed-item .fturno{ font-size:11.5px; font-weight:800; padding:3px 9px; border-radius:999px;
 border:1px solid; white-space:nowrap; }
.feed-item .fturno[data-t="ok"]{ color:#5CA85C; border-color:rgba(92,168,92,.5); }
.feed-item .fturno[data-t="tope"]{ color:var(--dorado); border-color:rgba(212,175,55,.6);
 background:rgba(212,175,55,.12); }
.feed-item .ftime{ font-size:12.5px; color:var(--gris-soft); font-weight:600; }
.feed-empty{ text-align:center; color:var(--gris-soft); font-size:13.5px; padding:30px 0; }

.banda-item{
 display:flex; align-items:center; justify-content:space-between; gap:12px;
 background:rgba(212,175,55,.1); border:1.5px solid var(--dorado); border-radius:12px;
 padding:13px 16px; margin-bottom:8px;
}
.banda-item .binfo{ min-width:0; display:flex; align-items:center; gap:9px; }
.banda-item .bdot{ width:12px; height:12px; border-radius:50%; flex-shrink:0; border:1px solid rgba(255,255,255,.25); }
.banda-item .btxt{ min-width:0; }
.banda-item .bname{ font-weight:800; font-size:15px; letter-spacing:.01em; }
.banda-item .bcolor{ font-size:12px; color:var(--gris-soft); font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
.banda-item .btime{ font-size:12px; color:var(--gris-soft); font-weight:600; margin-top:2px; }
.banda-item button{
 flex-shrink:0; background:var(--dorado); color:var(--negro); border:none; border-radius:9px;
 padding:10px 14px; font-size:12px; font-weight:900; letter-spacing:.04em; text-transform:uppercase;
 font-family:inherit; cursor:pointer;
}
.banda-item button:active{ opacity:.8; }

.setup-notice{
 background:rgba(212,175,55,.1); border:1.5px solid var(--dorado); border-radius:12px;
 padding:16px 18px; font-size:13px; color:var(--gris); line-height:1.6; margin-bottom:24px;
}
.setup-notice b{ color:var(--dorado); }

function fmtTime(ts){
 var d = new Date(ts);
 return d.toLocaleTimeString("es-CL", {hour:"2-digit", minute:"2-digit"});
}
function escapeHtml(s){
 return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; });
}
function parseDMY(str){
 if(!str) return null;
 var m = /^(\d{1,2})-(\d{1,2})-(\d{4})$/.exec(String(str).trim());
 if(!m) return null;
 var d = new Date(Number(m[3]), Number(m[2])-1, Number(m[1]));
 return isNaN(d) ? null : d;
}
function estadoVenc(venc){
 var d = parseDMY(venc);
 if(!d) return null;
 var hoy = new Date(); hoy.setHours(0,0,0,0);
 var diffDays = Math.round((d - hoy) / 86400000);
 if(diffDays < 0) return {cls:"danger", txt:"Vencido " + venc};
 if(diffDays <= 1) return {cls:"warn", txt:"Vence " + venc};
 return {cls:"good", txt:"Vence " + venc};
}

/* ── ¿quién llegó y puede pasar? ───────────────────────────────────── */
function sinTildes(s){
 return String(s==null?"":s).toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim();
}
function diaDelTs(ts){
 var d = ts ? new Date(ts) : new Date();
 if(isNaN(d)) d = new Date();
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function hoyISO(){
 var d = new Date();
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
/* Un mismo escaneo a veces llega repetido desde el script de Google. Se
   agrupan por persona + d\u00eda para que el feed muestre una sola l\u00ednea con
   "\u00d7N" en vez de N l\u00edneas iguales \u2014 igual que ya hace control.html. */
function juntarRepetidos(lista){
 var porLlave = {}, orden = [];
 lista.forEach(function(r){
  var k = sinTildes(r.nombre) + "|" + sinTildes(r.apellido) + "|" + diaDelTs(r.ts);
  var g = porLlave[k];
  if(!g){
   porLlave[k] = { nombre:r.nombre, apellido:r.apellido, ts:r.ts,
                   primera:r.ts, veces:1, dia:diaDelTs(r.ts) };
   orden.push(k);
   return;
  }
  g.veces++;
  if(r.ts > g.ts) g.ts = r.ts;
  if(r.ts < g.primera) g.primera = r.ts;
 });
 return orden.map(function(k){ return porLlave[k]; });
}
function textoVeces(g){
 if(g.veces < 2) return "";
 var cuando = (g.dia === hoyISO()) ? " hoy" : "";
 return g.veces + "\u00aa vez" + cuando;
}

/* \u2500\u2500 contador de d\u00edas para Turno, Tres Veces y Semanal \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
   Mismo criterio que ya usa control.html \u2014 Turno: 14 d\u00edas dentro del mes
   que paga. Tres Veces a la Semana: 12 d\u00edas en el mes (3 x 4 semanas), y
   adem\u00e1s la cuenta de la semana corrida como gu\u00eda. Plan Semanal: los d\u00edas
   de gimnasio abiertos (sin domingo) dentro de su semana pagada. Se cuenta
   sobre los mismos ingresos que ya llegan del script de Google, as\u00ed que el
   n\u00famero deber\u00eda ir quedando igual que el de control.html con el tiempo,
   aunque cada aparato lo calcula por su cuenta. */
var DIAS_TURNO = 14;
var DIAS_SEMANA = 3;
var DIAS_MES_3X = 12;
var CLAVE_ASIS = "wgym_asistencia_v1";
var CLAVE_CICLOS = "wgym_ciclos_v1";
var asistencia = {};
try{ asistencia = JSON.parse(localStorage.getItem(CLAVE_ASIS) || "{}") || {}; }catch(e){}
var ciclos = {};
try{ ciclos = JSON.parse(localStorage.getItem(CLAVE_CICLOS) || "{}") || {}; }catch(e){}
function guardarAsistencia(){ try{ localStorage.setItem(CLAVE_ASIS, JSON.stringify(asistencia)); }catch(e){} }
function guardarCiclos(){ try{ localStorage.setItem(CLAVE_CICLOS, JSON.stringify(ciclos)); }catch(e){} }
function llaveSocio(s){ return (s.n + "|" + s.a).toUpperCase(); }
function esTurno(s){ return !!s && /turno/i.test(s.plan || ""); }
function esTresVeces(s){ return !!s && /(?:^|\s)(?:3|tres)\s*veces/i.test(s.plan || ""); }
function esSemanalPlan(s){ return !!s && esPlanSemanal(s.plan); }
function planCuentaDias(s){ return esTurno(s) || esTresVeces(s) || esSemanalPlan(s); }
function fechaValida(v){
 var p = String(v || "").split("-");
 if(p.length !== 3 || p[0].length !== 4) return false;
 var f = new Date(+p[0], +p[1]-1, +p[2]);
 return !isNaN(f) && f.getFullYear() > 2000;
}
function sumarDias(iso, n){
 var p = String(iso).split("-");
 var f = new Date(+p[0], +p[1]-1, +p[2] + n);
 return f.getFullYear()+"-"+String(f.getMonth()+1).padStart(2,"0")+"-"+String(f.getDate()).padStart(2,"0");
}
function lunesDe(iso){
 var p = String(iso).split("-");
 var f = new Date(+p[0], +p[1]-1, +p[2]);
 f.setDate(f.getDate() - ((f.getDay() + 6) % 7));
 return f.getFullYear()+"-"+String(f.getMonth()+1).padStart(2,"0")+"-"+String(f.getDate()).padStart(2,"0");
}
function mesAtras(iso){
 var p = String(iso).split("-");
 var dia = +p[2];
 var f = new Date(+p[0], +p[1] - 2, 1);
 var ultimo = new Date(f.getFullYear(), f.getMonth() + 1, 0).getDate();
 f.setDate(Math.min(dia, ultimo));
 return f.getFullYear()+"-"+String(f.getMonth()+1).padStart(2,"0")+"-"+String(f.getDate()).padStart(2,"0");
}
function inicioPorDefecto(v, s){
 if(s && esSemanalPlan(s)) return sumarDias(v, -6);
 return sumarDias(mesAtras(v), 1);
}
function inicioCalculado(s){
 if(!s || !fechaValida(s.v)) return null;
 var c = ciclos[llaveSocio(s)];
 if(c && c.v === s.v && fechaValida(c.desde)) return c.desde;
 var desde = (c && hoyISO() <= s.v) ? hoyISO() : inicioPorDefecto(s.v, s);
 return (desde > s.v) ? inicioPorDefecto(s.v, s) : desde;
}
function anotarCiclo(s){
 var k = llaveSocio(s), c = ciclos[k], desde = inicioCalculado(s);
 if(!desde) return false;
 if(c && c.v === s.v && c.desde === desde) return false;
 ciclos[k] = { v:s.v, desde:desde };
 return true;
}
function anotarCiclos(){
 var cambio = false;
 lista.forEach(function(s){ if(planCuentaDias(s) && anotarCiclo(s)) cambio = true; });
 if(cambio) guardarCiclos();
}
function contarEntre(s, ini, fin){
 var dias = asistencia[llaveSocio(s)] || {};
 var n = 0;
 for(var d in dias){
  if(!Object.prototype.hasOwnProperty.call(dias, d)) continue;
  if(d >= ini && d <= fin) n++;
 }
 return n;
}
function diasUsados(s){ var c = reglaDe(s); return c ? contarEntre(s, c.ini, c.fin) : 0; }
function diasDeLaSemana(s){ var c = reglaDe(s); return (c && c.semana) ? contarEntre(s, c.semana.ini, c.semana.fin) : null; }
function marcarDia(s, iso){
 if(!planCuentaDias(s)) return false;
 var k = llaveSocio(s);
 if(!asistencia[k]) asistencia[k] = {};
 if(asistencia[k][iso]) return false;
 asistencia[k][iso] = 1;
 guardarAsistencia();
 return true;
}
function reglaDe(s){
 if(esTurno(s)){
  if(!s || !s.v) return null;
  return { tope:DIAS_TURNO, ini:inicioCalculado(s), fin:s.v, nombre:"Turno", cuando:"este mes", semana:null };
 }
 if(esTresVeces(s)){
  if(!s || !s.v) return null;
  var lun = lunesDe(hoyISO());
  return { tope:DIAS_MES_3X, ini:inicioCalculado(s), fin:s.v, nombre:"3 por semana", cuando:"este mes",
           semana:{ ini:lun, fin:sumarDias(lun, 6), tope:DIAS_SEMANA } };
 }
 if(esSemanalPlan(s)){
  if(!s || !s.v) return null;
  var ini = inicioCalculado(s);
  if(!ini) return null;
  var p1 = ini.split("-"), p2 = s.v.split("-");
  var tope = diasAbiertos(new Date(+p1[0], +p1[1]-1, +p1[2]), new Date(+p2[0], +p2[1]-1, +p2[2]));
  return { tope:tope || 1, ini:ini, fin:s.v, nombre:"Semanal", cuando:"esta semana", semana:null };
 }
 return null;
}
function notaTurno(s){
 var c = reglaDe(s);
 if(!c) return null;
 var n = diasUsados(s);
 var sem = diasDeLaSemana(s);
 var cola = sem === null ? "" : " \u00b7 " + sem + " esta semana";
 if(n > c.tope) return { pasado:true, n:n, txt:"Ya us\u00f3 sus " + c.tope + " d\u00edas de " + c.cuando + " \u00b7 lleva " + n + cola };
 if(n === c.tope) return { pasado:true, n:n, txt:"Este es su d\u00eda " + c.tope + " de " + c.tope + " de " + c.cuando + cola };
 return { pasado:false, n:n, txt:c.nombre + " \u00b7 d\u00eda " + (n || 0) + " de " + c.tope + " " + c.cuando + cola };
}

function isoDeSerial(fv){
 var base = new Date(1899,11,30); base.setHours(0,0,0,0);
 var d = new Date(base.getTime() + fv*86400000);
 return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") +
        "-" + String(d.getDate()).padStart(2,"0");
}
function fechaCL(v){
 if(!v) return "—";
 var p = String(v).split("-");
 return p[2] + "-" + p[1] + "-" + p[0];
}
/* Al plan semanal no se le cuenta el domingo: el gimnasio cierra ese dia. Si
   le quedan siete fechas por delante y una es domingo, de gimnasio le quedan
   seis. Los demas planes siguen contando dias corridos, tal cual estaban. */
function esPlanSemanal(nombre){ return /semanal/i.test(nombre || ""); }
function diasAbiertos(desde, hasta){
 var f = new Date(desde), n = 0;
 while(f < hasta){
  f.setDate(f.getDate() + 1);
  if(f.getDay() !== 0) n++;   /* 0 es domingo: no cuenta */
 }
 return n;
}
function diasPara(v, plan){
 if(!v) return null;
 var p = String(v).split("-");
 var f = new Date(+p[0], +p[1]-1, +p[2]); f.setHours(0,0,0,0);
 if(isNaN(f)) return null;
 var h = new Date(); h.setHours(0,0,0,0);
 /* Vencido o venciendo hoy se sigue contando en dias corridos: ahi lo que
    importa es hace cuanto fue, no cuantos dias de gimnasio le quedan. */
 if(f > h && esPlanSemanal(plan)) return diasAbiertos(h, f);
 return Math.round((f - h) / 86400000);
}

/* La lista que manda es la del mesón (control.html), que se guarda en este
   mismo navegador. Si esta pantalla corre en otro aparato, o todavía no se
   ha abierto el mesón acá, usa la lista publicada en el sitio. */
var CLAVE_MESON = "wgym_control_v1";
var lista = [], listaDeDonde = "sitio", crudoAnterior = false;

/* Si este aparato ya tiene guardada la lista del mesón (porque acá también
   se abrió control.html alguna vez, o porque esta misma pantalla ya venía
   fusionando), pero SOCIOS trae una versión más nueva que la última que se
   fusionó, se agregan los socios nuevos y se deja la fecha más adelantada
   de las dos — sin pisar nada. Así esta pantalla deja de quedarse pegada
   con una fecha vieja mientras control.html en otro equipo ya está al día:
   antes esta pantalla nunca comparaba versión con nadie, por eso un socio
   podía salir "vencido" acá y "vigente" allá aunque los dos leyeran la
   misma fecha publicada. Si el aparato no tiene nada guardado todavía,
   cargarLista() más abajo ya usa SOCIOS directo — no hace falta sembrar
   nada aquí. */
(function fusionarConElSitio(){
 var guardado = null;
 try{ guardado = JSON.parse(localStorage.getItem(CLAVE_MESON) || "null"); }catch(e){}
 if(!guardado || !Array.isArray(guardado.socios)) return;
 var versionVista = (typeof guardado.version === "number") ? guardado.version : 0;
 if(SOCIOS_VERSION <= versionVista) return;
 var mios = {};
 guardado.socios.forEach(function(s){ mios[sinTildes(s.n) + "|" + sinTildes(s.a)] = s; });
 SOCIOS.forEach(function(b, i){
  var bv = isoDeSerial(b.fv);
  var k = sinTildes(b.n) + "|" + sinTildes(b.a);
  var m = mios[k];
  if(!m){
   var nuevo = { id:"p"+i+"_"+Date.now().toString(36), n:b.n, a:b.a, plan:b.plan, m:0, v:bv };
   guardado.socios.push(nuevo);
   mios[k] = nuevo;
   return;
  }
  if(!m.v || bv > m.v) m.v = bv;
  if(!m.plan) m.plan = b.plan;
 });
 guardado.version = SOCIOS_VERSION;
 try{ localStorage.setItem(CLAVE_MESON, JSON.stringify(guardado)); }catch(e){}
})();

/* Devuelve true si la lista cambió desde la última vez. */
function cargarLista(){
 var crudo = null;
 try{ crudo = localStorage.getItem(CLAVE_MESON); }catch(e){}
 if(crudo === crudoAnterior && lista.length) return false;
 crudoAnterior = crudo;
 try{
  var g = JSON.parse(crudo || "null");
  if(g && Array.isArray(g.socios) && g.socios.length){
   lista = g.socios.map(function(s){ return { n:s.n, a:s.a, plan:s.plan, v:s.v }; });
   listaDeDonde = "meson";
   return true;
  }
 }catch(e){}
 lista = SOCIOS.map(function(s){ return { n:s.n, a:s.a, plan:s.plan, v:isoDeSerial(s.fv) }; });
 listaDeDonde = "sitio";
 return true;
}
cargarLista();
/* Si agregas un socio en el mesón con esta pantalla abierta, se entera sola. */
window.addEventListener("storage", function(ev){
 if(ev.key !== CLAVE_MESON) return;
 if(!cargarLista()) return;
 pintarOrigen();
 renderFeed(ultimasFilas);
 if(ultimasFilas.length) showHero(ultimasFilas[0]);
});

function pintarOrigen(){
 var el = document.getElementById("origenLista");
 if(!el) return;
 el.textContent = (listaDeDonde === "meson" ? "Lista del mesón" : "Lista del sitio") +
                  " · " + lista.length + " socios";
}

/* Busca al socio por como venga escrito en el registro del QR. */
function buscarSocio(nombre, apellido){
 var q = sinTildes(nombre + " " + apellido);
 if(!q) return null;
 var exacto = lista.filter(function(s){ return sinTildes(s.n + " " + s.a) === q; });
 if(exacto.length === 1) return exacto[0];
 var partes = q.split(" ");
 var calzan = lista.filter(function(s){
  var completo = sinTildes(s.n + " " + s.a);
  return partes.every(function(p){ return completo.indexOf(p) > -1; });
 });
 return calzan.length === 1 ? calzan[0] : null;   /* si hay dudas, no inventa */
}
function veredictoDe(r){
 var s = buscarSocio(r.nombre, r.apellido);
 if(!s){
  var viejo = estadoVenc(r.venc);
  return { v:"nadie", fallo:"No está en la lista de socios",
           detalle: viejo ? viejo.txt : "Revísalo en la planilla",
           corto:"Sin ficha de socio", cls:"", plan:"" };
 }
 var dias = diasPara(s.v, s.plan);
 var vence = fechaCL(s.v);
 if(dias === null){
  return { v:"nadie", fallo:"Ficha sin fecha de vencimiento",
           detalle:"Revísale la fecha en el mesón", corto:"Sin fecha", cls:"", plan:s.plan };
 }
 if(dias < 0){
  return { v:"bad", fallo:"Acceso denegado · membresía vencida",
           detalle:"Venció el " + vence + " · hace " + Math.abs(dias) + (Math.abs(dias)===1?" día":" días"),
           corto:null, cls:"danger", plan:s.plan };
 }
 if(dias <= 1){
  return { v:"warn", fallo:"Pasa, pero avísale",
           detalle: dias === 0 ? "Vence hoy" : "Vence el " + vence + " · quedan " + dias + (dias===1?" día":" días"),
           corto:null, cls:"warn", plan:s.plan };
 }
 return { v:"ok", fallo:"Acceso permitido",
          detalle:"Vence el " + vence + " · quedan " + dias + " días",
          corto:null, cls:"good", plan:s.plan };
}

var seenKeys = {};
var ultimasFilas = [];
var firstPoll = true;

function keyOf(r){ return r.ts + "|" + r.nombre + "|" + r.apellido; }

function renderFeed(rows){
 var feed = document.getElementById("feed");
 var agrupadas = juntarRepetidos(rows);
 if(agrupadas.length===0){ feed.innerHTML = '<div class="feed-empty">Todavía no hay ingresos registrados.</div>'; return; }
 feed.innerHTML = agrupadas.map(function(r){
  var d = veredictoDe(r);
  var s = buscarSocio(r.nombre, r.apellido);
  var nt = s ? notaTurno(s) : null;
  var nota = d.corto || d.detalle;
  var vencHtml = nota ? '<span class="fvenc '+d.cls+'">'+escapeHtml(nota)+'</span>' : '';
  var turnoHtml = nt ? '<span class="fturno" data-t="'+(nt.pasado?"tope":"ok")+'">'+escapeHtml(nt.txt)+'</span>' : '';
  var vecesHtml = r.veces > 1 ? '<span class="fveces">'+escapeHtml(textoVeces(r))+'</span>' : '';
  return '<div class="feed-item"><span class="finfo"><span class="fname">'+escapeHtml(r.nombre)+' '+escapeHtml(r.apellido)+'</span>'+vencHtml+turnoHtml+vecesHtml+'</span><span class="ftime">'+fmtTime(r.ts)+'</span></div>';
 }).join('');
}

function showHero(r){
 document.getElementById("heroEmpty").hidden = true;
 var falloEl = document.getElementById("heroFallo");
 var nameEl  = document.getElementById("heroName");
 var timeEl  = document.getElementById("heroTime");
 var vencEl  = document.getElementById("heroVenc");
 var turnoEl = document.getElementById("heroTurno");
 var planEl  = document.getElementById("heroPlan");
 var d = veredictoDe(r);
 var s = buscarSocio(r.nombre, r.apellido);

 document.getElementById("hero").setAttribute("data-v", d.v);
 falloEl.hidden = false; falloEl.textContent = d.fallo;
 nameEl.hidden = false;  nameEl.textContent = r.nombre + " " + r.apellido;
 timeEl.hidden = false;  timeEl.textContent = fmtTime(r.ts);
 if(d.detalle){ vencEl.hidden = false; vencEl.textContent = d.detalle; vencEl.className = "venc " + d.cls; }
 else { vencEl.hidden = true; }
 var nt = s ? notaTurno(s) : null;
 if(nt){
  turnoEl.hidden = false; turnoEl.textContent = nt.txt;
  turnoEl.setAttribute("data-t", nt.pasado ? "tope" : "ok");
 } else { turnoEl.hidden = true; }
 if(d.plan){ planEl.hidden = false; planEl.textContent = d.plan; }
 else { planEl.hidden = true; }
}
function flashHero(r){
 showHero(r);
 var hero = document.getElementById("hero");
 hero.classList.remove("flash");
 void hero.offsetWidth;
 hero.classList.add("flash");
}

function handleData(data){
 var rows = data.rows || [];
 ultimasFilas = rows;
 var cambioLista = cargarLista();   /* por si agregaste un socio recién */
 pintarOrigen();
 /* Cada ingreso le suma el día a su cuenta de Turno / Tres Veces / Semanal.
    El mismo día repetido no vuelve a sumar (marcarDia ya lo controla). */
 rows.forEach(function(r){
  var sr = buscarSocio(r.nombre, r.apellido);
  if(sr) marcarDia(sr, diaDelTs(r.ts));
 });
 if(rows.length > 0){
  var newest = rows[0];
  if(!firstPoll && !seenKeys[keyOf(newest)]){
   flashHero(newest);
  } else if(firstPoll || cambioLista){
   /* La lista cambió: recalcula el veredicto sin destellar de nuevo. */
   showHero(newest);
  }
 }
 rows.forEach(function(r){ seenKeys[keyOf(r)] = true; });
 firstPoll = false;
 renderFeed(rows);
}

var pollCounter = 0;
function poll(){
 pollCounter++;
 var cb = "wgymCb" + pollCounter + "_" + Date.now();
 window[cb] = function(data){
  handleData(data);
  delete window[cb];
  script.remove();
 };
 var script = document.createElement("script");
 script.src = CHECKIN_URL + "?callback=" + cb + "&_=" + Date.now();
 script.onerror = function(){ delete window[cb]; script.remove(); };
 document.body.appendChild(script);
}

/* ---------- bandas elásticas ---------- */
function fmtMin(ts){
 var min = Math.max(0, Math.round((Date.now() - ts) / 60000));
 return min + " min";
}
var COLOR_DOT = { Negra:"#2B2B2B", Verde:"#5CA85C", Morada:"#9B59D0", Roja:"#E30613", Amarilla:"#E8C547" };
function renderBandas(activos){
 var el = document.getElementById("bandasFeed");
 if(!activos || activos.length===0){
  el.innerHTML = '<div class="feed-empty">Nadie ha pedido banda por ahora.</div>';
  return;
 }
 el.innerHTML = activos.map(function(b){
  var color = b.banda || "";
  var dot = COLOR_DOT[color] || "#8C8C8C";
  return '<div class="banda-item"><span class="binfo"><span class="bdot" style="background:'+dot+'"></span>'+
   '<span class="btxt"><span class="bname">'+escapeHtml(b.nombre)+' '+escapeHtml(b.apellido)+'</span><br>'+
   '<span class="bcolor">'+escapeHtml(color)+'</span> · <span class="btime">Hace '+fmtMin(b.retiro)+'</span></span></span>'+
   '<button type="button" data-id="'+escapeHtml(b.id)+'">Devolver</button></div>';
 }).join('');
}
function pollBandas(){
 pollCounter++;
 var cb = "wgymBandaCb" + pollCounter + "_" + Date.now();
 window[cb] = function(data){
  renderBandas(data && data.activos);
  delete window[cb];
  script.remove();
 };
 var script = document.createElement("script");
 script.src = CHECKIN_URL + "?action=listarBandas&callback=" + cb + "&_=" + Date.now();
 script.onerror = function(){ delete window[cb]; script.remove(); };
 document.body.appendChild(script);
}
document.getElementById("bandasFeed").addEventListener("click", function(ev){
 var btn = ev.target.closest("button[data-id]");
 if(!btn) return;
 btn.disabled = true;
 var cb = "wgymDevBanda_" + Date.now();
 window[cb] = function(){
  delete window[cb];
  script.remove();
  pollBandas();
 };
 var script = document.createElement("script");
 script.src = CHECKIN_URL + "?action=devolverBanda&id=" + encodeURIComponent(btn.getAttribute("data-id")) + "&callback=" + cb + "&_=" + Date.now();
 script.onerror = function(){ delete window[cb]; script.remove(); btn.disabled = false; };
 document.body.appendChild(script);
});

poll();
pollBandas();
setInterval(poll, 4000);
setInterval(pollBandas, 4000);

/* Esta pantalla se queda abierta todo el día en una tablet, sin que nadie
   la recargue. Si mientras tanto se publica una lista nueva (renovaciones,
   socios nuevos), se queda pegada con la copia vieja hasta que alguien la
   refresque a mano — y ahí es cuando un socio sale "vencido" acá aunque en
   control.html ya esté al día. Para que nunca más se desincronicen, se
   recarga sola cada 10 minutos: como es solo de lectura (nadie escribe
   fichas en esta pantalla), recargarla no pierde nada. */
setInterval(function(){ location.reload(); }, 10 * 60 * 1000);
})();
</script>
