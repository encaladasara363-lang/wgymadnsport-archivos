name: Validar rutinas
on:
  push:
    paths: ["rutinas/**", "validar-rutina.js", "scripts/validar-rutinas.js", "img/rutinas/**"]
  pull_request:
    paths: ["rutinas/**", "validar-rutina.js", "scripts/validar-rutinas.js", "img/rutinas/**"]
  workflow_dispatch:
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validar-rutinas.js
