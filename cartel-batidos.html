  :root{--ink:#0D0D0F;--paper:#FFFFFF;--red:#E30613;--gold:#D4AF37;--steel:#6E7278;--hairline:#DCDCD9;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#E7E7E3;font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;gap:28px;padding:48px 16px 80px;}
  .page-label{font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8B8E92;font-size:12px;}
  .poster{position:relative;width:794px;height:1123px;background:var(--paper);border-radius:18px;
    overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.35);
    display:flex;flex-direction:column;align-items:center;padding:38px 54px 28px;}
  .top-bar{position:absolute;top:0;left:0;right:0;height:16px;background:var(--ink);}
  .top-bar::after{content:"";position:absolute;left:0;top:0;height:16px;width:220px;background:var(--red);}
  .gold-line{position:absolute;top:16px;left:0;right:0;height:3px;background:var(--gold);}
  .logo{width:112px;height:112px;border-radius:50%;overflow:hidden;border:4px solid var(--ink);flex-shrink:0;}
  .logo img{width:100%;height:100%;object-fit:cover;}
  .kicker{margin-top:12px;font-weight:800;letter-spacing:.26em;text-transform:uppercase;font-size:18px;color:var(--ink);}
  .kicker span{color:var(--red);}
  .divider{width:110px;height:5px;background:var(--red);margin-top:10px;flex-shrink:0;}
  .tag{margin-top:22px;background:var(--red);color:var(--paper);
    font-family:'Anton','Arial Black',Impact,sans-serif;font-weight:900;
    letter-spacing:.04em;transform:skewX(-6deg);box-shadow:9px 9px 0 var(--ink);flex-shrink:0;}
  .tag span{display:inline-block;transform:skewX(6deg);}
  .subtitle{margin-top:16px;font-weight:800;text-transform:uppercase;letter-spacing:.16em;
    font-size:21px;color:var(--ink);text-align:center;}
  .spacer{flex:1;min-height:10px;}
  .sign-block{width:100%;padding-top:16px;border-top:3px solid var(--ink);
    display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  .sign-block .role{font-family:'Anton','Arial Black',Impact,sans-serif;font-weight:900;
    font-size:24px;letter-spacing:.03em;color:var(--ink);}
  .sign-block .brand{font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:15px;color:var(--steel);text-align:right;}
  .sign-block .brand b{display:block;color:var(--ink);font-size:16px;letter-spacing:.08em;}
  @media print{body{background:#fff;padding:0;gap:0;}.page-label{display:none;}
    .poster{width:210mm;height:297mm;box-shadow:none;border-radius:0;}
    @page{size:A4 portrait;margin:0;}}

  .tag{font-size:40px;padding:11px 44px;}

  .incluye{margin-top:32px;width:100%;}
  .incluye h3{font-family:'Anton','Arial Black',Impact,sans-serif;font-weight:900;
    font-size:26px;color:var(--paper);background:var(--red);display:inline-block;
    padding:4px 16px;letter-spacing:.05em;transform:skewX(-6deg);margin-bottom:10px;}
  .incluye h3 span{display:inline-block;transform:skewX(6deg);}
  .incluye ul{list-style:none;border-top:3px solid var(--ink);}
  .incluye li{position:relative;padding:19px 0 17px 34px;border-bottom:3px solid var(--hairline);
    font-weight:800;text-transform:uppercase;letter-spacing:.02em;
    font-size:31px;color:var(--ink);line-height:1.2;}
  .incluye li::before{content:"";position:absolute;left:5px;top:27px;
    width:14px;height:14px;background:var(--red);border-radius:4px;}
  .opcion{margin-top:26px;width:100%;background:var(--ink);border-radius:14px;
    padding:24px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .opcion .t{font-weight:800;text-transform:uppercase;letter-spacing:.06em;
    font-size:27px;color:var(--paper);line-height:1.15;}
  .opcion .t small{display:block;font-size:16px;letter-spacing:.14em;color:#9C9CA3;}
  .opcion .p{font-family:'Anton','Arial Black',Impact,sans-serif;font-weight:900;
    font-size:66px;color:var(--gold);white-space:nowrap;}
