<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rutina Sara Encalada — WGYM ADN SPORT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0909;
    --bg-2:#111011;
    --surface:#18161a;
    --surface-2:#211d22;
    --border:#322c33;
    --border-soft:#242023;
    --text:#f4f1ee;
    --text-dim:#a79fa6;
    --text-faint:#756d74;
    --accent:#e11c30;
    --accent-2:#ff4757;
    --accent-dim:#4a0e15;
    --gold:#f0a83c;
    --success:#3ccb6e;
    --success-dim:#123821;
    --font-display:'Bebas Neue', Impact, 'Arial Narrow', sans-serif;
    --font-body:'Inter', system-ui, -apple-system, sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  img{max-width:100%;}
  ::selection{background:var(--accent);color:#fff;}
  h1,h2,h3,.font-display{font-family:var(--font-display);letter-spacing:0.02em;margin:0;}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;}
  button{font-family:inherit;cursor:pointer;border:none;}
  input,textarea{font-family:inherit;}
  textarea:focus, input:focus, button:focus-visible{outline:2px solid var(--accent-2);outline-offset:1px;}

  @keyframes pulseRing{
    0%{box-shadow:0 0 0 0 rgba(225,28,48,0.55);}
    70%{box-shadow:0 0 0 10px rgba(225,28,48,0);}
    100%{box-shadow:0 0 0 0 rgba(225,28,48,0);}
  }
  .pulse-live{animation:pulseRing 2s infinite;}
  @media (prefers-reduced-motion: reduce){ .pulse-live{animation:none;} }

  /* ---- layout helpers ---- */
  .container{max-width:72rem;margin:0 auto;padding:0 1rem;}
  .flex{display:flex;}
  .flex-col{flex-direction:column;}
  .flex-wrap{flex-wrap:wrap;}
  .items-center{align-items:center;}
  .items-start{align-items:flex-start;}
  .items-end{align-items:flex-end;}
  .justify-between{justify-content:space-between;}
  .justify-center{justify-content:center;}
  .justify-end{justify-content:flex-end;}
  .shrink-0{flex-shrink:0;}
  .flex-1{flex:1 1 0%;min-width:0;}
  .w-full{width:100%;}
  .text-center{text-align:center;}
  .relative{position:relative;}

  /* ---- header ---- */
  .app-header{position:sticky;top:0;z-index:40;background:rgba(10,9,9,0.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--border-soft);}
  .app-header-inner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0.75rem;padding:0.75rem 0;}
  .brand{display:flex;align-items:center;gap:0.75rem;}
  .brand-title{font-size:1.75rem;line-height:1;}
  .brand-title .accent{color:var(--accent-2);}
  .brand-sub{font-size:0.6875rem;text-transform:uppercase;letter-spacing:0.14em;font-weight:600;color:var(--text-faint);margin-top:0.2rem;}
  .logo{position:relative;flex-shrink:0;border-radius:50%;width:52px;height:52px;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 32% 28%, #2a2226, #0d0b0c 70%);border:2px solid var(--accent);
    box-shadow:0 0 0 3px rgba(225,28,48,0.15), 0 4px 14px rgba(0,0,0,0.5);}
  .logo-w{font-family:var(--font-display);font-size:26px;color:var(--accent-2);}
  .logo-tag{position:absolute;bottom:-4px;padding:1px 6px;border-radius:9999px;background:var(--accent);color:#fff;font-family:var(--font-mono);font-size:7px;letter-spacing:0.03em;}

  /* ---- session timer ---- */
  .session-timer{display:flex;align-items:center;gap:0.75rem;}
  .session-timer-label{font-size:0.625rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-faint);}
  .live-dot{display:inline-block;width:6px;height:6px;border-radius:9999px;background:var(--accent-2);margin-left:4px;vertical-align:middle;}
  .session-timer-value{font-family:var(--font-mono);font-size:1.65rem;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;}
  .icon-btn{width:36px;height:36px;border-radius:0.5rem;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border);}
  .icon-btn.primary{background:var(--accent);color:#fff;border:none;}
  .icon-btn svg{width:16px;height:16px;}

  /* ---- hero ---- */
  .hero{border-radius:1rem;padding:1rem 1.1rem;margin:1.25rem 0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem;
    background:linear-gradient(120deg, var(--accent-dim), var(--surface) 60%);border:1px solid var(--border-soft);}
  .hero-eyebrow{font-size:0.6875rem;text-transform:uppercase;letter-spacing:0.14em;font-weight:600;color:var(--accent-2);}
  .hero-name{font-size:2.2rem;line-height:1;margin-top:0.15rem;}
  .hero-stats{display:flex;flex-wrap:wrap;gap:0.625rem;font-family:var(--font-mono);font-size:0.75rem;}
  .stat-chip{padding:0.5rem 0.75rem;border-radius:0.5rem;text-align:center;background:var(--bg-2);border:1px solid var(--border-soft);}
  .stat-chip .k{color:var(--text-faint);}
  .stat-chip .v{color:var(--gold);margin-top:2px;}

  /* ---- day nav ---- */
  .day-nav{display:flex;gap:0.5rem;overflow-x:auto;padding-bottom:0.25rem;margin-bottom:1.25rem;-webkit-overflow-scrolling:touch;}
  .day-tab{flex-shrink:0;min-width:104px;text-align:left;border-radius:0.75rem;padding:0.6rem 0.85rem;background:var(--surface);border:1px solid var(--border-soft);color:var(--text);}
  .day-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .day-tab-label{font-family:var(--font-display);font-size:1rem;line-height:1;}
  .day-tab-sub{font-size:0.625rem;margin-top:0.25rem;line-height:1.2;color:var(--text-faint);}
  .day-tab.active .day-tab-sub{color:rgba(255,255,255,0.85);}

  /* ---- day header ---- */
  .day-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0.75rem;margin-bottom:1rem;}
  .day-title{font-size:2.1rem;line-height:1;}
  .day-subtitle{font-size:0.875rem;font-weight:500;color:var(--accent-2);margin-top:0.15rem;}
  .kcal-chip{font-family:var(--font-mono);font-size:0.75rem;padding:0.45rem 0.65rem;border-radius:0.5rem;background:var(--bg-2);color:var(--gold);border:1px solid var(--border-soft);}
  .btn-export{display:flex;align-items:center;gap:0.35rem;font-size:0.75rem;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;padding:0.5rem 0.85rem;border-radius:0.5rem;background:var(--accent);color:#fff;}
  .btn-export svg{width:16px;height:16px;}

  /* ---- exercise grid / card ---- */
  .exercise-grid{display:grid;grid-template-columns:1fr;gap:1rem;}
  @media (min-width:1024px){ .exercise-grid{grid-template-columns:1fr 1fr;} }
  .exercise-card{border-radius:1rem;overflow:hidden;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border-soft);}
  .exercise-head{padding:0.9rem 1rem 0.75rem;display:flex;align-items:flex-start;gap:0.75rem;border-bottom:1px solid var(--border-soft);}
  .type-toggle{display:flex;gap:0.25rem;margin-bottom:0.25rem;}
  .type-pill{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;padding:0.1rem 0.5rem;border-radius:9999px;background:var(--bg-2);color:var(--text-faint);border:1px solid var(--border-soft);}
  .type-pill.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .exercise-name{width:100%;background:transparent;border:none;color:var(--text);font-family:var(--font-display);font-size:1.35rem;letter-spacing:0.02em;padding:0;}
  .exercise-meta{display:flex;flex-wrap:wrap;align-items:center;gap:0.75rem 0.9rem;margin-top:0.25rem;}
  .meta-field{display:flex;align-items:center;gap:0.35rem;font-size:0.75rem;color:var(--text-dim);}
  .meta-field input{background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--gold);font-family:var(--font-mono);font-size:0.75rem;padding:0.1rem 0.15rem;width:8rem;}
  .meta-field input.narrow{width:3.5rem;color:var(--text);}
  .meta-field .unit{font-family:var(--font-mono);font-size:0.75rem;color:var(--text-faint);}
  .exercise-side{display:flex;flex-direction:column;align-items:flex-end;gap:0.4rem;flex-shrink:0;}
  .badge-count{font-family:var(--font-mono);font-size:0.625rem;padding:0.1rem 0.5rem;border-radius:9999px;background:var(--bg-2);border:1px solid var(--border-soft);color:var(--text-faint);}
  .badge-count.done{color:var(--success);}
  .del-btn{width:28px;height:28px;border-radius:0.5rem;display:flex;align-items:center;justify-content:center;color:var(--text-faint);background:transparent;}
  .del-btn svg{width:16px;height:16px;}

  .explain-wrap{padding:0.75rem 1rem 0;}
  .explain-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;background:transparent;color:var(--accent-2);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.12em;padding:0.35rem 0;}
  .explain-toggle svg{width:14px;height:14px;transition:transform .15s;}
  .explain-toggle.open svg{transform:rotate(180deg);}
  .explain-text{width:100%;margin-bottom:0.75rem;border-radius:0.5rem;padding:0.6rem;font-size:12px;line-height:1.55;font-weight:500;resize:vertical;background:var(--bg-2);border:1px solid var(--border-soft);color:var(--text-dim);display:none;}
  .explain-text.open{display:block;}

  .sets-wrap{padding:0 1rem 0.75rem;}
  .sets-grid{display:grid;grid-template-columns:1.4rem 1fr 1fr 2.2rem 1.6rem;gap:0.375rem;align-items:center;}
  .sets-head{font-size:10px;text-transform:uppercase;letter-spacing:0.03em;color:var(--text-faint);}
  .set-num{font-family:var(--font-mono);font-size:0.875rem;color:var(--text-faint);}
  .set-input{border-radius:0.5rem;padding:0.35rem 0.5rem;font-family:var(--font-mono);font-size:0.875rem;width:100%;background:var(--bg-2);border:1px solid var(--border-soft);color:var(--text);}
  .set-input.weight{color:var(--gold);}
  .set-check{border-radius:0.5rem;display:flex;align-items:center;justify-content:center;background:var(--bg-2);border:1px solid var(--border-soft);color:var(--text-faint);height:2rem;}
  .set-check.done{background:var(--success-dim);border-color:var(--success);color:var(--success);}
  .set-check svg{width:14px;height:14px;}
  .set-remove{display:flex;align-items:center;justify-content:center;color:var(--text-faint);background:transparent;height:2rem;}
  .set-remove svg{width:14px;height:14px;}
  .add-set-btn{margin-top:0.6rem;width:100%;display:flex;align-items:center;justify-content:center;gap:0.35rem;font-size:0.75rem;font-weight:600;text-transform:uppercase;letter-spacing:0.02em;padding:0.5rem;border-radius:0.5rem;background:var(--bg-2);color:var(--text-dim);border:1px dashed var(--border);}
  .add-set-btn svg{width:14px;height:14px;}

  .rest-wrap{padding:0 1rem 1rem;margin-top:auto;}
  .rest-timer{position:relative;display:flex;align-items:center;gap:0.65rem;border-radius:0.75rem;padding:0.5rem 0.6rem;background:var(--bg-2);border:1px solid var(--border-soft);transition:background .3s,border-color .3s;}
  .rest-timer.finished{background:var(--success-dim);border-color:var(--success);}
  .rest-banner{position:absolute;top:-2.3rem;left:50%;transform:translateX(-50%);white-space:nowrap;padding:0.35rem 0.75rem;border-radius:0.5rem;font-family:var(--font-display);font-size:0.875rem;letter-spacing:0.02em;z-index:10;background:var(--success);color:#06170d;display:none;}
  .rest-banner.show{display:block;}
  .rest-circle-wrap{position:relative;width:36px;height:36px;flex-shrink:0;}
  .rest-circle-wrap svg{width:36px;height:36px;transform:rotate(-90deg);}
  .rest-bell{position:absolute;inset:0;margin:auto;width:14px;height:14px;color:var(--success);display:none;}
  .rest-bell.show{display:block;}
  .rest-time{font-family:var(--font-mono);font-size:0.875rem;font-weight:600;width:3rem;color:var(--text);}
  .rest-time.finished{color:var(--success);}
  .rest-actions{display:flex;align-items:center;gap:0.25rem;margin-left:auto;}
  .rest-btn{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.02em;padding:0.35rem 0.6rem;border-radius:0.5rem;background:var(--accent);color:#fff;}
  .rest-btn.pause{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
  .rest-reset{width:28px;height:28px;border-radius:0.5rem;display:flex;align-items:center;justify-content:center;color:var(--text-faint);background:transparent;}
  .rest-reset svg{width:14px;height:14px;}

  .add-exercise-btn{margin-top:1rem;width:100%;display:flex;align-items:center;justify-content:center;gap:0.5rem;font-family:var(--font-display);font-size:1.15rem;letter-spacing:0.02em;padding:0.9rem;border-radius:1rem;background:var(--surface);color:var(--text-dim);border:1px dashed var(--border);}
  .add-exercise-btn svg{width:20px;height:20px;}

  .rest-day-card{border-radius:1rem;padding:2.5rem 1.5rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:0.75rem;background:var(--surface);border:1px solid var(--border-soft);}
  .tag-stripe{width:64px;height:6px;border-radius:9999px;opacity:0.7;background:repeating-linear-gradient(135deg,var(--accent) 0 10px,var(--accent-2) 10px 20px);}
  .rest-day-title{font-size:2rem;margin-top:0.5rem;}
  .rest-day-text{max-width:32rem;font-size:0.875rem;line-height:1.6;color:var(--text-dim);}

  .app-footer{max-width:72rem;margin:0 auto;padding:0 1rem 2rem;}
  .app-footer p{font-size:11px;text-align:center;color:var(--text-faint);}

  .toast{position:fixed;bottom:1.25rem;left:50%;transform:translateX(-50%);z-index:50;padding:0.65rem 1rem;border-radius:0.75rem;font-weight:500;font-size:0.875rem;box-shadow:0 8px 24px rgba(0,0,0,0.4);background:var(--success-dim);color:var(--success);border:1px solid var(--success);display:none;}
  .toast.show{display:block;}

  .modal-overlay{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;padding:1rem;background:rgba(0,0,0,0.7);}
  .modal-overlay.show{display:flex;}
  @media (min-width:640px){ .modal-overlay{align-items:center;} }
  .modal-panel{width:100%;max-width:32rem;border-radius:1rem;padding:1.1rem;background:var(--surface);border:1px solid var(--border);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.5rem;}
  .modal-head h3{font-size:1.35rem;}
  .modal-close{width:32px;height:32px;border-radius:0.5rem;display:flex;align-items:center;justify-content:center;color:var(--text-dim);background:transparent;}
  .modal-close svg{width:16px;height:16px;}
  .modal-hint{font-size:0.75rem;color:var(--text-dim);margin-bottom:0.5rem;}
  .modal-textarea{width:100%;border-radius:0.5rem;padding:0.75rem;font-family:var(--font-mono);font-size:0.75rem;line-height:1.6;resize:none;background:var(--bg-2);border:1px solid var(--border-soft);color:var(--text);}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="modal-overlay" class="modal-overlay">
  <div class="modal-panel" onclick="event.stopPropagation()">
    <div class="modal-head">
      <h3 class="font-display">Copiar resumen</h3>
      <button class="modal-close" onclick="closeModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <p class="modal-hint">La descarga automática no está disponible en este navegador. El texto ya está seleccionado: copie con el botón de copiar del teclado y péguelo donde quiera guardarlo.</p>
    <textarea id="modal-textarea" class="modal-textarea" rows="12" readonly></textarea>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ============================== DATOS ============================== */

  var STORAGE_KEY = 'wgym-sara-routine-v2';
  var TIMER_KEY = 'wgym-sara-session-timer-v2';

  var uidCounter = 1;
  function uid(p) { return p + '-' + (uidCounter++).toString(36); }

  function makeSets(n) {
    var out = [];
    for (var i = 0; i < n; i++) out.push({ id: uid('set'), weight: '', reps: '', done: false });
    return out;
  }

  function ex(name, targetReps, restSeconds, sets, explanation) {
    return { id: uid('ex'), type: 'strength', name: name, targetReps: targetReps, restSeconds: restSeconds, explanation: explanation, sets: makeSets(sets) };
  }

  function cardioEx(name, targetPace, blockMinutes, explanation) {
    var e = ex(name, targetPace, blockMinutes * 60, 1, explanation);
    e.type = 'cardio';
    return e;
  }

  function defaultRoutine() {
    return {
      lunes: {
        key: 'lunes', label: 'LUN', fullLabel: 'LUNES', subtitle: 'Piernas · Cuádriceps', kcal: 2450, isRest: false,
        exercises: [
          ex('Sentadilla trasera con barra', '8-10', 120, 4,
            'PARADA CON LOS PIES AL ANCHO DE LOS HOMBROS Y LA BARRA APOYADA SOBRE EL TRAPECIO, NO SOBRE EL CUELLO. BAJE EMPUJANDO LAS CADERAS HACIA ATRÁS Y LAS RODILLAS EN LA MISMA DIRECCIÓN QUE LOS PIES, MANTENIENDO EL PECHO ARRIBA Y LA ESPALDA NEUTRA. DESCIENDA HASTA QUE LA CADERA QUEDE A LA ALTURA DE LA RODILLA O UN POCO MÁS ABAJO, SIN PERDER LA CURVA LUMBAR. INHALE Y GENERE PRESIÓN ABDOMINAL ANTES DE BAJAR, Y EXHALE AL SUBIR EMPUJANDO EL PISO CON TODA LA PLANTA DEL PIE. ES EL EJERCICIO BASE DE LA SESIÓN: PRIORICE LA TÉCNICA SOBRE EL PESO, SOBRE TODO EN LAS PRIMERAS SERIES.'),
          ex('Prensa de piernas 45°', '10-12', 90, 4,
            'SIÉNTESE CON LA ESPALDA Y LA ZONA LUMBAR COMPLETAMENTE APOYADAS EN EL RESPALDO, PIES AL ANCHO DE LOS HOMBROS SOBRE LA PLATAFORMA Y LIGERAMENTE MÁS ARRIBA PARA ENFATIZAR CUÁDRICEPS. BAJE EL PESO CONTROLADO HASTA QUE LA RODILLA FORME UN ÁNGULO CERCANO A 90°, SIN QUE LA CADERA SE DESPEGUE DEL ASIENTO NI LAS RODILLAS SE HUNDAN HACIA ADENTRO. EMPUJE SIN BLOQUEAR LAS RODILLAS DE FORMA BRUSCA AL FINAL DEL RECORRIDO. PERMITE MOVER MÁS CARGA QUE LA SENTADILLA CON MENOR EXIGENCIA DE ESTABILIDAD, IDEAL PARA ACUMULAR VOLUMEN SIN FATIGAR TANTO LA ZONA LUMBAR.'),
          ex('Zancada caminando con mancuernas', '12 por pierna', 75, 3,
            'CON UNA MANCUERNA EN CADA MANO, DÉ UN PASO LARGO AL FRENTE Y BAJE HASTA QUE AMBAS RODILLAS FORMEN APROXIMADAMENTE 90°, LA RODILLA TRASERA CASI ROZANDO EL SUELO Y EL TORSO ERGUIDO. EMPUJE CON EL TALÓN DE LA PIERNA DELANTERA PARA AVANZAR AL SIGUIENTE PASO SIN PERDER EL EQUILIBRIO. MANTENGA EL CORE ACTIVADO PARA EVITAR QUE LA CADERA ROTE HACIA UN LADO. ES UN EJERCICIO UNILATERAL QUE CORRIGE DESEQUILIBRIOS DE FUERZA ENTRE UNA PIERNA Y OTRA, ADEMÁS DE EXIGIR ESTABILIDAD DE CADERA Y TOBILLO.'),
          ex('Extensión de cuádriceps en máquina', '15', 60, 3,
            'AJUSTE EL RESPALDO PARA QUE LA RODILLA QUEDE ALINEADA CON EL EJE DE GIRO DE LA MÁQUINA Y EL RODILLO APOYE SOBRE EL TOBILLO. EXTIENDA LA PIERNA DE FORMA CONTROLADA HASTA CASI LA EXTENSIÓN COMPLETA, APRETANDO EL CUÁDRICEPS UN SEGUNDO ARRIBA, Y BAJE SIN SOLTAR EL PESO DE GOLPE. EVITE IMPULSARSE CON LA CADERA O DESPEGAR LA ESPALDA DEL RESPALDO. AL SER UN EJERCICIO DE AISLAMIENTO, SIRVE PARA TERMINAR DE FATIGAR EL CUÁDRICEPS DESPUÉS DE LOS MOVIMIENTOS MULTIARTICULARES.'),
          ex('Sentadilla búlgara', '10 por pierna', 75, 3,
            'APOYE EL EMPEINE DE UN PIE SOBRE UN BANCO DETRÁS DE USTED Y MANTENGA LA MAYOR PARTE DEL PESO EN LA PIERNA DELANTERA. BAJE DE FORMA VERTICAL, CASI COMO UNA ZANCADA ESTÁTICA, HASTA SENTIR UN BUEN ESTIRAMIENTO DE GLÚTEO Y CUÁDRICEPS, Y SUBA EMPUJANDO CON EL TALÓN DELANTERO. EL TRONCO PUEDE INCLINARSE LIGERAMENTE HACIA ADELANTE SIN REDONDEAR LA ESPALDA. EXIGE MUCHO EQUILIBRIO: SI FALTA ESTABILIDAD, SUJÉTESE DE UN APOYO CON UNA MANO SIN QUITARLE INTENSIDAD A LA PIERNA DE TRABAJO.'),
          ex('Elevación de talones de pie', '15-20', 45, 4,
            'PARADA SOBRE UN ESCALÓN O LA MÁQUINA DE PANTORRILLAS, CON LOS TALONES LIBRES PARA BAJAR POR DEBAJO DEL NIVEL DE LOS DEDOS Y CONSEGUIR UN BUEN ESTIRAMIENTO DEL GEMELO. SUBA LO MÁS ALTO POSIBLE APRETANDO LA PANTORRILLA ARRIBA POR UN SEGUNDO, Y BAJE DE FORMA LENTA Y CONTROLADA. EVITE REBOTAR EN LA PARTE BAJA DEL MOVIMIENTO, YA QUE LE QUITA TENSIÓN AL MÚSCULO Y CARGA EL TENDÓN DE AQUILES. CIERRA LA SESIÓN DE PIERNAS TRABAJANDO LA PANTORRILLA CON SANGRE YA ACUMULADA EN LA ZONA.'),
        ],
      },
      martes: {
        key: 'martes', label: 'MAR', fullLabel: 'MARTES', subtitle: 'Empuje · Pecho, hombro, tríceps', kcal: 2180, isRest: false,
        exercises: [
          ex('Press banca con barra', '8-10', 120, 4,
            'ACUÉSTESE EN EL BANCO CON LOS OMÓPLATOS RETRAÍDOS Y LIGERAMENTE JUNTOS, LOS PIES BIEN APOYADOS EN EL SUELO Y UN LEVE ARCO NATURAL EN LA ESPALDA BAJA. BAJE LA BARRA DE FORMA CONTROLADA HASTA TOCAR LA PARTE MEDIA DEL PECHO, CODOS A UNOS 45° DEL TORSO, Y EMPUJE HACIA ARRIBA Y LIGERAMENTE HACIA ATRÁS HASTA EXTENDER LOS BRAZOS. NO REBOTE LA BARRA SOBRE EL PECHO. ES EL MOVIMIENTO PRINCIPAL DE EMPUJE HORIZONTAL: TRABAJE CON UN COMPAÑERO QUE HAGA DE ASISTENCIA CUANDO SUBA LA CARGA.'),
          ex('Press militar con mancuernas', '10', 90, 3,
            'SENTADO O DE PIE CON EL CORE FIRME, SOSTENGA LAS MANCUERNAS A LA ALTURA DE LOS HOMBROS CON LAS PALMAS AL FRENTE. EMPUJE HACIA ARRIBA HASTA CASI EXTENDER LOS CODOS SIN QUE LAS MANCUERNAS SE CHOQUEN NI LA ESPALDA BAJA SE ARQUEE EN EXCESO. BAJE CONTROLADO HASTA QUE EL CODO QUEDE UN POCO POR DEBAJO DEL HOMBRO. RESPIRE SOSTENIENDO EL AIRE EN LA FASE DE EMPUJE PARA DAR ESTABILIDAD AL TRONCO. TRABAJA PRINCIPALMENTE EL DELTOIDE ANTERIOR Y MEDIO.'),
          ex('Press inclinado con mancuernas', '10-12', 90, 3,
            'INCLINE EL BANCO ENTRE 30° Y 45°, YA QUE UNA INCLINACIÓN MAYOR QUITA TRABAJO AL PECHO Y SE LO PASA AL HOMBRO. LLEVE LAS MANCUERNAS DESDE LA ALTURA DEL PECHO HACIA ARRIBA EN UNA LIGERA TRAYECTORIA EN ARCO, SIN EXTENDER LOS CODOS DE GOLPE. BAJE HASTA SENTIR UN BUEN ESTIRAMIENTO EN LA PARTE SUPERIOR DEL PECHO, SIN DEJAR CAER LOS HOMBROS HACIA ATRÁS. AL USAR MANCUERNAS EN LUGAR DE BARRA, CADA BRAZO TRABAJA DE FORMA INDEPENDIENTE Y CORRIGE DESBALANCES.'),
          ex('Elevaciones laterales', '15', 60, 3,
            'CON UNA MANCUERNA EN CADA MANO Y LOS CODOS LIGERAMENTE FLEXIONADOS, ELEVE LOS BRAZOS HACIA LOS LADOS HASTA LA ALTURA DE LOS HOMBROS, LIDERANDO EL MOVIMIENTO CON EL CODO Y NO CON LA MUÑECA. NO USE IMPULSO DE LA CADERA NI SUBA POR ENCIMA DE LA LÍNEA DE LOS HOMBROS. BAJE DE FORMA LENTA PARA MANTENER LA TENSIÓN EN EL DELTOIDE MEDIO DURANTE TODO EL RECORRIDO. ES UN EJERCICIO DE AISLAMIENTO CLAVE PARA DARLE ANCHO VISUAL AL HOMBRO.'),
          ex('Fondos en paralelas', '10-12', 75, 3,
            'SUJETO DE LAS BARRAS CON LOS BRAZOS EXTENDIDOS, INCLINE LIGERAMENTE EL TRONCO HACIA ADELANTE PARA ENFATIZAR EL PECHO Y BAJE HASTA QUE EL HOMBRO QUEDE A LA ALTURA DEL CODO, SIN PASARSE DE PROFUNDIDAD SI SIENTE MOLESTIA EN EL HOMBRO. EMPUJE HACIA ARRIBA HASTA EXTENDER LOS BRAZOS SIN BLOQUEAR EL CODO DE FORMA BRUSCA. SI ES MUY EXIGENTE, USE LA MÁQUINA ASISTIDA O UN BANCO PARA APOYAR LOS PIES. TRABAJA PECHO INFERIOR Y TRÍCEPS EN CONJUNTO.'),
          ex('Extensión de tríceps en polea', '15', 60, 3,
            'DE PIE FRENTE A LA POLEA ALTA CON LOS CODOS PEGADOS AL CUERPO, EMPUJE LA BARRA O CUERDA HACIA ABAJO HASTA EXTENDER POR COMPLETO EL BRAZO, APRETANDO EL TRÍCEPS AL FINAL. SUBA DE FORMA CONTROLADA SIN QUE EL CODO SE DESPEGUE DEL TORSO NI SUBA POR ENCIMA DEL PECHO. SI USA CUERDA, ABRA LAS PUNTAS HACIA AFUERA Y ABAJO AL FINAL DEL MOVIMIENTO PARA MAYOR CONTRACCIÓN. CIERRA EL DÍA DE EMPUJE AISLANDO EL TRÍCEPS YA PREFATIGADO POR EL PRESS Y LOS FONDOS.'),
          ex('Press francés con barra Z', '12', 60, 3,
            'ACOSTADO EN EL BANCO CON LA BARRA Z SOSTENIDA SOBRE EL PECHO Y LOS CODOS APUNTANDO AL TECHO, BAJE LA BARRA FLEXIONANDO SOLO EL CODO HASTA ACERCARLA A LA FRENTE O DETRÁS DE LA CABEZA, SIN MOVER LOS HOMBROS. EXTIENDA DE VUELTA CONTROLANDO EL PESO EN TODO EL RECORRIDO, YA QUE ES UN EJERCICIO DONDE LA BARRA QUEDA CERCA DE LA CARA. MANTENGA LOS CODOS FIJOS Y APUNTANDO HACIA ARRIBA DURANTE TODA LA SERIE. TRABAJA LA CABEZA LARGA DEL TRÍCEPS, LA QUE MÁS APORTA VOLUMEN AL BRAZO.'),
        ],
      },
      miercoles: {
        key: 'miercoles', label: 'MIÉ', fullLabel: 'MIÉRCOLES', subtitle: 'Piernas · Glúteos e isquios', kcal: 2450, isRest: false,
        exercises: [
          ex('Peso muerto rumano con barra', '8-10', 120, 4,
            'CON LA BARRA APOYADA EN LOS MUSLOS Y LAS RODILLAS LIGERAMENTE FLEXIONADAS, LLEVE LA CADERA HACIA ATRÁS MANTENIENDO LA BARRA PEGADA A LAS PIERNAS Y LA ESPALDA RECTA. BAJE HASTA SENTIR UN ESTIRAMIENTO FUERTE EN LOS ISQUIOTIBIALES, GENERALMENTE A LA ALTURA DE LA MITAD DE LA CANILLA, Y SUBA EMPUJANDO LA CADERA HACIA ADELANTE Y APRETANDO EL GLÚTEO ARRIBA. LA RODILLA SE MUEVE POCO: EL MOVIMIENTO ES DE CADERA, NO DE SENTADILLA. ES EL EJERCICIO REY PARA LA CADENA POSTERIOR DE LA PIERNA.'),
          ex('Hip thrust con barra', '10-12', 90, 4,
            'CON LA ESPALDA APOYADA EN UN BANCO A LA ALTURA DE LOS OMÓPLATOS Y LA BARRA SOBRE LA CADERA, PIES APOYADOS FIRMES Y CERCA DE LOS GLÚTEOS, EMPUJE LA CADERA HACIA ARRIBA HASTA QUE EL TORSO QUEDE PARALELO AL SUELO, APRETANDO FUERTE EL GLÚTEO EN LA PARTE ALTA POR UN SEGUNDO. BAJE CONTROLADO SIN QUE LA CADERA TOQUE EL SUELO ENTRE REPETICIÓN Y REPETICIÓN SI BUSCA TENSIÓN CONSTANTE. EVITE HIPEREXTENDER LA ESPALDA BAJA AL LLEGAR ARRIBA: QUIEN TRABAJA ES EL GLÚTEO, NO LA LUMBAR. ES EL MOVIMIENTO MÁS ESPECÍFICO PARA DESARROLLAR GLÚTEO.'),
          ex('Curl femoral en máquina', '12-15', 75, 3,
            'ACOSTADA BOCA ABAJO O SENTADA SEGÚN LA MÁQUINA, AJUSTE EL RODILLO A LA ALTURA DEL TOBILLO Y LA CADERA BIEN FIJA CONTRA EL RELLENO. FLEXIONE LA RODILLA LLEVANDO EL TALÓN HACIA EL GLÚTEO DE FORMA CONTROLADA, APRETANDO EL ISQUIOTIBIAL AL FINAL DEL RECORRIDO, Y VUELVA SIN SOLTAR EL PESO DE GOLPE. NO LEVANTE LA CADERA DEL ASIENTO PARA GANAR RECORRIDO. TRABAJA EL ISQUIOTIBIAL DE FORMA AISLADA, COMPLEMENTANDO EL TRABAJO QUE YA HIZO EL PESO MUERTO RUMANO.'),
          ex('Sentadilla sumo con mancuerna', '12', 75, 3,
            'PARE CON LOS PIES MÁS ANCHOS QUE LOS HOMBROS Y LAS PUNTAS ROTADAS HACIA AFUERA, SOSTENIENDO UNA MANCUERNA CON AMBAS MANOS FRENTE A LA CADERA. BAJE MANTENIENDO LAS RODILLAS EN LA MISMA DIRECCIÓN QUE LOS PIES Y EL TORSO LO MÁS VERTICAL POSIBLE, LLEVANDO LA MANCUERNA CASI AL SUELO ENTRE LAS PIERNAS. SUBA APRETANDO GLÚTEO E INTERIOR DEL MUSLO. LA POSTURA ANCHA CAMBIA EL ÉNFASIS HACIA GLÚTEO Y ADUCTORES RESPECTO A UNA SENTADILLA TRADICIONAL.'),
          ex('Patada de glúteo en polea', '15 por pierna', 60, 3,
            'CON EL TOBILLO SUJETO AL CABLE BAJO Y SOSTENIDA DEL MARCO DE LA MÁQUINA, INCLINE LIGERAMENTE EL TORSO AL FRENTE Y LLEVE LA PIERNA HACIA ATRÁS Y ARRIBA EN LÍNEA RECTA, APRETANDO EL GLÚTEO AL FINAL SIN ARQUEAR LA ESPALDA BAJA PARA GANAR ALTURA. VUELVA DE FORMA CONTROLADA SIN QUE EL PESO TIRE DE LA PIERNA DE GOLPE. MANTENGA LA RODILLA CON UNA LIGERA FLEXIÓN FIJA DURANTE TODA LA SERIE. ES UN MOVIMIENTO DE AISLAMIENTO PURO PARA EL GLÚTEO MAYOR.'),
          ex('Abducción de cadera en máquina', '15-20', 45, 3,
            'SENTADA CON LA ESPALDA APOYADA Y LAS RODILLAS CONTRA LOS APOYOS DE LA MÁQUINA, ABRA LAS PIERNAS HACIA AFUERA CONTRA LA RESISTENCIA HASTA EL LÍMITE CÓMODO DEL RANGO, APRETANDO EL GLÚTEO MEDIO EN LA POSICIÓN ABIERTA. VUELVA DE FORMA CONTROLADA SIN DEJAR QUE EL PESO LA JALE DE GOLPE HACIA ADENTRO. EVITE IMPULSARSE CON LA ESPALDA. TRABAJA EL GLÚTEO MEDIO, RESPONSABLE DE LA FORMA REDONDEADA LATERAL DEL GLÚTEO Y DE LA ESTABILIDAD DE LA CADERA AL CAMINAR.'),
          ex('Elevación de talones sentado', '15-20', 45, 3,
            'SENTADA EN LA MÁQUINA CON LAS RODILLAS DEBAJO DEL RODILLO ACOLCHADO Y LAS PUNTAS DE LOS PIES SOBRE LA PLATAFORMA, BAJE LOS TALONES TODO LO POSIBLE PARA ESTIRAR Y SUBA APRETANDO FUERTE LA PANTORRILLA ARRIBA. AL TRABAJAR CON LA RODILLA FLEXIONADA, EL ÉNFASIS PASA DEL GEMELO AL SÓLEO, EL MÚSCULO MÁS PROFUNDO DE LA PANTORRILLA. USE UN RITMO LENTO, YA QUE LA PANTORRILLA RESPONDE MEJOR AL VOLUMEN ALTO QUE A LA CARGA MÁXIMA.'),
        ],
      },
      jueves: {
        key: 'jueves', label: 'JUE', fullLabel: 'JUEVES', subtitle: 'Tirón · Espalda y bíceps', kcal: 2180, isRest: false,
        exercises: [
          ex('Jalón al pecho', '8-10', 120, 4,
            'SENTADA CON LOS MUSLOS FIJOS BAJO LOS APOYOS, TOME LA BARRA CON UN AGARRE ALGO MÁS ANCHO QUE LOS HOMBROS Y TIRE LLEVANDO LOS CODOS HACIA ABAJO Y ATRÁS, ACERCANDO LA BARRA A LA PARTE ALTA DEL PECHO SIN ECHAR EL TRONCO HACIA ATRÁS DE FORMA EXAGERADA. SUBA CONTROLANDO EL PESO HASTA EXTENDER LOS BRAZOS POR COMPLETO, SINTIENDO EL ESTIRAMIENTO DEL DORSAL. PIENSE EN "LLEVAR EL CODO AL BOLSILLO" PARA ACTIVAR ESPALDA EN LUGAR DE SOLO EL BRAZO. ES EL SUSTITUTO IDEAL DE LA DOMINADA MIENTRAS SE GANA FUERZA PARA HACERLA CON EL PROPIO PESO.'),
          ex('Remo con barra', '10', 90, 4,
            'CON EL TRONCO INCLINADO ALREDEDOR DE 45° Y LA ESPALDA RECTA, TOME LA BARRA CON AGARRE PRONO Y TIRE HACIA EL ABDOMEN BAJO, LLEVANDO LOS CODOS HACIA ATRÁS Y APRETANDO LOS OMÓPLATOS AL FINAL. BAJE CONTROLADO SIN REDONDEAR LA ESPALDA NI USAR IMPULSO DE LAS PIERNAS PARA LEVANTAR EL PESO. MANTENGA EL CUELLO EN LÍNEA CON LA COLUMNA, MIRANDO AL SUELO UN POCO ADELANTE. TRABAJA EL GROSOR DE LA ESPALDA MEDIA, CLAVE PARA UNA ESPALDA QUE SE VEA FUERTE DE PERFIL.'),
          ex('Remo en polea baja, agarre estrecho', '12', 75, 3,
            'SENTADA CON LAS RODILLAS LIGERAMENTE FLEXIONADAS Y LA ESPALDA RECTA, TIRE DEL AGARRE HACIA EL ABDOMEN LLEVANDO LOS CODOS PEGADOS AL CUERPO Y APRETANDO LOS OMÓPLATOS AL FINAL DEL RECORRIDO. NO SE ECHE HACIA ATRÁS CON TODO EL TRONCO PARA MOVER MÁS PESO: EL MOVIMIENTO LO HACE LA ESPALDA, NO LA CADERA. VUELVA CONTROLADA HASTA SENTIR UN BUEN ESTIRAMIENTO DEL DORSAL AL FRENTE. EL AGARRE ESTRECHO PRIORIZA EL GROSOR CENTRAL DE LA ESPALDA.'),
          ex('Pull-over en polea', '12', 60, 3,
            'DE PIE FRENTE A LA POLEA ALTA CON UNA BARRA RECTA, LOS BRAZOS CASI EXTENDIDOS Y UNA LIGERA FLEXIÓN DE CODO FIJA, LLEVE LOS BRAZOS DESDE ARRIBA HACIA ABAJO EN UN ARCO HASTA LA ALTURA DEL MUSLO, SINTIENDO EL ESTIRAMIENTO Y LA CONTRACCIÓN DEL DORSAL EN TODO EL RECORRIDO. EL MOVIMIENTO OCURRE EN EL HOMBRO, NO EN EL CODO, QUE SE MANTIENE CASI FIJO. SUBA DE FORMA CONTROLADA SIN DEJAR QUE EL PESO TIRE DE LOS BRAZOS DE GOLPE. AYUDA A DARLE ANCHO A LA ESPALDA TRABAJANDO EL DORSAL EN UN ÁNGULO DIFERENTE AL DE LOS JALONES.'),
          ex('Curl con barra Z', '12', 60, 3,
            'DE PIE CON LOS CODOS PEGADOS AL TORSO Y LA BARRA Z TOMADA EN LOS ÁNGULOS DE LA EMPUÑADURA, FLEXIONE EL CODO LLEVANDO LA BARRA HACIA EL HOMBRO SIN BALANCEAR EL CUERPO NI ABRIR LOS CODOS HACIA LOS LADOS. APRIETE EL BÍCEPS ARRIBA Y BAJE DE FORMA LENTA HASTA CASI LA EXTENSIÓN COMPLETA DEL BRAZO. LA FORMA EN Z DE LA BARRA REDUCE LA TENSIÓN EN LA MUÑECA COMPARADA CON UNA BARRA RECTA. ES EL EJERCICIO BASE PARA GANAR GROSOR EN EL BÍCEPS.'),
          ex('Curl martillo con mancuernas', '12 por brazo', 60, 3,
            'CON UNA MANCUERNA EN CADA MANO Y LAS PALMAS MIRÁNDOSE ENTRE SÍ TODO EL RECORRIDO, FLEXIONE EL CODO LLEVANDO EL PESO HACIA EL HOMBRO SIN ROTAR LA MUÑECA. MANTENGA EL CODO FIJO PEGADO AL COSTADO Y EVITE USAR IMPULSO DE HOMBRO. EL AGARRE NEUTRO ACTIVA MÁS EL BRAQUIAL Y EL ANTEBRAZO ADEMÁS DEL BÍCEPS, DÁNDOLE MÁS GROSOR VISUAL AL BRAZO DESDE EL COSTADO. PUEDE HACERSE ALTERNANDO BRAZOS O DE FORMA SIMULTÁNEA.'),
          ex('Face pull en polea', '15', 45, 3,
            'CON LA POLEA A LA ALTURA DE LA CARA Y UNA CUERDA COMO AGARRE, TIRE LLEVANDO LAS MANOS HACIA LOS LADOS DE LA CABEZA, SEPARANDO LAS PUNTAS DE LA CUERDA Y LLEVANDO LOS CODOS ALTOS Y ATRÁS, COMO SI QUISIERA MIRAR ENTRE SUS PROPIOS BRAZOS. APRIETE LOS OMÓPLATOS Y LA PARTE POSTERIOR DEL HOMBRO AL FINAL DEL MOVIMIENTO. USE UN PESO LIVIANO: LA PRIORIDAD ES LA CALIDAD DE LA CONTRACCIÓN. FORTALECE EL DELTOIDE POSTERIOR Y LA POSTURA, EQUILIBRANDO TODO EL TRABAJO DE EMPUJE DE LA SEMANA.'),
        ],
      },
      viernes: {
        key: 'viernes', label: 'VIE', fullLabel: 'VIERNES', subtitle: 'Tren superior + Abdomen', kcal: 2130, isRest: false,
        exercises: [
          ex('Press banca con mancuernas', '10', 90, 3,
            'ACOSTADA EN EL BANCO PLANO CON UNA MANCUERNA EN CADA MANO A LA ALTURA DEL PECHO, EMPUJE HACIA ARRIBA HASTA CASI EXTENDER LOS CODOS SIN CHOCAR LAS MANCUERNAS ENTRE SÍ. BAJE DE FORMA CONTROLADA HASTA SENTIR UN BUEN ESTIRAMIENTO DEL PECHO, PERMITIENDO UN RECORRIDO MÁS AMPLIO QUE CON BARRA. MANTENGA LOS OMÓPLATOS RETRAÍDOS DURANTE TODA LA SERIE. AL SER UN DÍA CON MENOS VOLUMEN QUE EL MARTES, TRABAJE CON UN PESO MODERADO ENFOCADO EN LA CALIDAD DEL MOVIMIENTO.'),
          ex('Remo en máquina sentado', '12', 75, 3,
            'SENTADA CON EL PECHO APOYADO EN EL SOPORTE, TIRE DE LAS EMPUÑADURAS HACIA ATRÁS LLEVANDO LOS CODOS DETRÁS DEL TORSO Y APRETANDO LOS OMÓPLATOS. VUELVA DE FORMA CONTROLADA SIN QUE EL PESO CAIGA DE GOLPE NI EL TRONCO SE DESPEGUE DEL RESPALDO. AL ESTAR EL TORSO FIJO EN LA MÁQUINA, PUEDE CONCENTRARSE POR COMPLETO EN LA CONTRACCIÓN DE LA ESPALDA SIN AYUDARSE CON IMPULSO. COMPLEMENTA EL TRABAJO DE ESPALDA DEL JUEVES CON MENOS FATIGA ARTICULAR.'),
          ex('Elevaciones laterales + frontales (superserie)', '12+12', 60, 3,
            'REALICE PRIMERO 12 ELEVACIONES LATERALES LLEVANDO LOS BRAZOS A LOS COSTADOS HASTA LA ALTURA DEL HOMBRO, Y SIN DESCANSAR ENCADENE 12 ELEVACIONES FRONTALES LLEVANDO LAS MANCUERNAS AL FRENTE HASTA LA MISMA ALTURA. EN AMBOS CASOS EVITE EL IMPULSO Y CONTROLE LA BAJADA. LA SUPERSERIE PERMITE TRABAJAR EL DELTOIDE MEDIO Y ANTERIOR EN POCO TIEMPO, IDEAL PARA UN DÍA DE VOLUMEN MODERADO COMO EL VIERNES.'),
          ex('Curl + extensión de tríceps (superserie)', '12+12', 60, 3,
            'ENCADENE 12 REPETICIONES DE CURL DE BÍCEPS CON MANCUERNAS Y, SIN DESCANSAR, 12 REPETICIONES DE EXTENSIÓN DE TRÍCEPS EN POLEA O CON MANCUERNA. TRABAJAR MÚSCULOS ANTAGONISTAS UNO DESPUÉS DEL OTRO MANTIENE EL BRAZO IRRIGADO DE SANGRE Y AHORRA TIEMPO SIN PERDER INTENSIDAD. CUIDE LA TÉCNICA DE CADA MOVIMIENTO POR SEPARADO AUNQUE ESTÉN ENCADENADOS: LA FATIGA ACUMULADA TIENDE A HACER QUE SE PIERDA LA FORMA HACIA EL FINAL DE LA SERIE.'),
          ex('Crunch abdominal en polea alta', '15', 45, 3,
            'DE RODILLAS FRENTE A LA POLEA ALTA CON LA CUERDA SOSTENIDA JUNTO A LA CABEZA, FLEXIONE EL TRONCO HACIA ABAJO LLEVANDO LOS CODOS HACIA LAS RODILLAS Y CONTRAYENDO EL ABDOMEN, NO TIRANDO CON LOS BRAZOS NI LA CADERA. LA CADERA SE MANTIENE PRÁCTICAMENTE FIJA: EL MOVIMIENTO ES DE LA COLUMNA TORÁCICA HACIA ABAJO. VUELVA DE FORMA CONTROLADA SIN PERDER LA TENSIÓN EN EL ABDOMEN. PERMITE AÑADIR CARGA PROGRESIVA AL ABDOMEN, ALGO QUE LOS EJERCICIOS DE PESO CORPORAL NO OFRECEN.'),
          ex('Elevación de piernas colgada', '12-15', 45, 3,
            'COLGADA DE UNA BARRA CON AGARRE FIRME, ELEVE LAS PIERNAS FLEXIONANDO LA CADERA HASTA LLEVAR LOS MUSLOS AL MENOS A LA HORIZONTAL, EVITANDO BALANCEARSE CON IMPULSO. BAJE DE FORMA CONTROLADA SIN DEJAR CAER LAS PIERNAS DE GOLPE. SI ES MUY EXIGENTE, FLEXIONE LAS RODILLAS PARA REDUCIR LA PALANCA. TRABAJA EL RECTO ABDOMINAL Y LA PARTE BAJA DEL ABDOMEN, UNA ZONA DIFÍCIL DE ACTIVAR CON EJERCICIOS DE SUELO.'),
          ex('Plancha lateral', '30-40 s por lado', 45, 3,
            'APOYADA SOBRE EL ANTEBRAZO Y EL BORDE DEL PIE, MANTENGA EL CUERPO EN UNA LÍNEA RECTA DESDE LA CABEZA HASTA LOS TOBILLOS, SIN DEJAR CAER NI SUBIR EN EXCESO LA CADERA. APRIETE EL ABDOMEN Y EL GLÚTEO DEL LADO DE APOYO PARA SOSTENER LA POSICIÓN. RESPIRE DE FORMA CONSTANTE, SIN AGUANTAR EL AIRE DURANTE LOS SEGUNDOS DE TRABAJO. FORTALECE EL OBLICUO Y LA ESTABILIDAD LATERAL DEL TRONCO, CLAVE PARA PROTEGER LA ESPALDA EN LOS DÍAS DE PIERNA.'),
          ex('Rueda abdominal', '10-12', 60, 3,
            'DE RODILLAS CON LA RUEDA APOYADA EN EL SUELO FRENTE A USTED, RUEDE HACIA ADELANTE MANTENIENDO EL ABDOMEN CONTRAÍDO Y LA ESPALDA SIN HUNDIRSE, LLEGANDO SOLO HASTA DONDE PUEDA CONTROLAR EL REGRESO. VUELVA A LA POSICIÓN INICIAL CONTRAYENDO EL ABDOMEN, NO TIRANDO CON LA ESPALDA BAJA. SI ES MUY EXIGENTE, REDUZCA EL RECORRIDO O HÁGALO CONTRA UNA PARED. ES UNO DE LOS EJERCICIOS MÁS COMPLETOS PARA EL CORE, YA QUE EXIGE TODO EL ABDOMEN PARA EVITAR QUE LA ESPALDA SE ARQUEE.'),
        ],
      },
      sabado: {
        key: 'sabado', label: 'SÁB', fullLabel: 'SÁBADO', subtitle: 'Metabólico · Puntos débiles', kcal: 2180, isRest: false,
        exercises: [
          ex('Circuito: sentadilla goblet + burpee', '12+8', 45, 4,
            'SOSTENGA UNA MANCUERNA O KETTLEBELL PEGADA AL PECHO Y REALICE 12 SENTADILLAS GOBLET BAJANDO ENTRE LAS PIERNAS CON EL TORSO ERGUIDO. SIN DESCANSAR, DEJE EL PESO Y ENCADENE 8 BURPEES: BAJE A PLANCHA, HAGA UNA FLEXIÓN SI EL NIVEL LO PERMITE, Y SALTE ARRIBA AL TERMINAR. MANTENGA UN RITMO CONSTANTE MÁS QUE EXPLOSIVO PARA CUIDAR LA TÉCNICA CON LA FATIGA ACUMULADA DE LA SEMANA. ES UN BLOQUE METABÓLICO QUE ELEVA LA FRECUENCIA CARDÍACA SIN AGREGAR CARDIO POR SEPARADO, RESPETANDO LA REGLA DE "NADA DE CARDIO EXTRA" DE LA DIETA.'),
          ex('Zancada con salto', '10 por pierna', 45, 3,

  function loadRoutine() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultRoutine();
      var parsed = JSON.parse(raw);
      var def = defaultRoutine();
      for (var i = 0; i < DAY_ORDER.length; i++) {
        if (!parsed[DAY_ORDER[i]]) parsed[DAY_ORDER[i]] = def[DAY_ORDER[i]];
      }
      return parsed;
    } catch (e) { return defaultRoutine(); }
  }
  function saveRoutine() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(routine)); } catch (e) {} }

  function loadTimer() {
    try {
      var raw = localStorage.getItem(TIMER_KEY);
      if (!raw) return { running: false, accumulated: 0, startedAt: null };
      return JSON.parse(raw);
    } catch (e) { return { running: false, accumulated: 0, startedAt: null }; }

  function fmtClock(totalSeconds) {
    var s = Math.max(0, Math.floor(totalSeconds));
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var sec = s % 60;
    function pad(n) { return (n < 10 ? '0' : '') + n; }
    return h > 0 ? (pad(h) + ':' + pad(m) + ':' + pad(sec)) : (pad(m) + ':' + pad(sec));
  }
  function todayStr() {
    var d = new Date();
    return d.toLocaleDateString('es-CL', { year: 'numeric', month: '2-digit', day: '2-digit' });
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function findExercise(exId) {
    var list = routine[activeDay].exercises;
    for (var i = 0; i < list.length; i++) if (list[i].id === exId) return list[i];
    return null;
  }

  /* ---- Beep sintetizado con Web Audio API (sin archivos externos) ---- */
  var audioCtx = null;
  function getAudioCtx() {
    try {
      if (!audioCtx) {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        audioCtx = new Ctx();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
    return audioCtx;
  }
  function playBeep() {
    try {
      var ctx = getAudioCtx();
      if (!ctx) return;
      var tones = [880, 660, 880, 660, 880, 1046.5, 880, 1046.5];
      tones.forEach(function (freq, i) {
        var start = ctx.currentTime + i * 0.32;
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.9, start + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + 0.32);
      });
    } catch (e) {}
  }

  /* Pide permiso de notificacion UNA vez, dentro del gesto de "Iniciar descanso".
     Es un refuerzo best-effort: en Android con Chrome puede mostrar un aviso del
     sistema aunque la pestana este al fondo; en iPhone, Safari normal (no la app
     agregada a la pantalla de inicio) no soporta notificaciones y esta llamada
     simplemente no hace nada. */
  function ensureNotifyPermission() {
    try {
      if (typeof Notification === 'undefined') return;
      if (Notification.permission === 'default') Notification.requestPermission();
    } catch (e) {}
  }

  function notifyRestDone(exerciseName) {
    try {
      if (typeof Notification === 'undefined') return;
      if (Notification.permission !== 'granted') return;
      if (!document.hidden) return;
      new Notification('\u00a1Descanso terminado!', { body: exerciseName.toUpperCase(), tag: 'wgym-rest' });
    } catch (e) {}
  }

  /* ============================== CRONÓMETRO DE SESIÓN ============================== */

  function toggleSessionTimer() {
    if (sessionTimer.running) {
      var add = sessionTimer.startedAt ? Math.floor((Date.now() - sessionTimer.startedAt) / 1000) : 0;
      sessionTimer = { running: false, accumulated: sessionTimer.accumulated + add, startedAt: null };
    } else {
      sessionTimer = { running: true, accumulated: sessionTimer.accumulated, startedAt: Date.now() };
    }
    saveTimer();
    updateSessionTimerUI();
  }
  function resetSessionTimer() {
    sessionTimer = { running: false, accumulated: 0, startedAt: null };
    saveTimer();
    updateSessionTimerUI();
  }
  function currentSessionElapsed() {
    return sessionTimer.accumulated + (sessionTimer.running && sessionTimer.startedAt ? Math.floor((Date.now() - sessionTimer.startedAt) / 1000) : 0);
  }
  function updateSessionTimerUI() {
    var valueEl = document.getElementById('session-timer-value');
    var btn = document.getElementById('session-toggle-btn');
    var dot = document.getElementById('session-live-dot');
    if (!valueEl || !btn) return;
    valueEl.textContent = fmtClock(currentSessionElapsed());
    if (sessionTimer.running) {
      btn.innerHTML = ICONS.pause;
      btn.setAttribute('aria-label', 'Pausar cronómetro');
      dot.style.display = 'inline-block';
    } else {
      btn.innerHTML = ICONS.play;
      btn.setAttribute('aria-label', 'Iniciar cronómetro');
      dot.style.display = 'none';
    }
  }
  setInterval(updateSessionTimerUI, 1000);

  function restTimerHTML(exercise) {
    var isCardio = exercise.type === 'cardio';
    var startLabel = isCardio ? 'Cardio' : 'Descanso';
    var st = restTimers[exercise.id];
    var remaining = exercise.restSeconds;
    var running = false;
    if (st) {
      running = !!st.running;
      remaining = running ? Math.max(0, Math.ceil((st.endAt - Date.now()) / 1000)) : st.pausedRemaining;
    }
    var isZero = remaining <= 0;
    var justFinished = st && st.justFinished;
    var pct = exercise.restSeconds > 0 ? Math.max(0, Math.min(1, remaining / exercise.restSeconds)) : 0;
    var R = 15.5, C = 2 * Math.PI * R;

    return '<div class="rest-timer' + (justFinished ? ' finished' : '') + '" id="rest-timer-' + exercise.id + '" data-rest-seconds="' + exercise.restSeconds + '">' +
      '<div class="rest-banner' + (justFinished ? ' show' : '') + '" id="rest-banner-' + exercise.id + '">¡TIEMPO CUMPLIDO — ' + esc(exercise.name.toUpperCase()) + '!</div>' +
      '<div class="rest-circle-wrap">' +
        '<svg viewBox="0 0 36 36">' +
          '<circle cx="18" cy="18" r="' + R + '" fill="none" stroke="var(--border)" stroke-width="3"/>' +
          '<circle id="rest-circle-' + exercise.id + '" cx="18" cy="18" r="' + R + '" fill="none" stroke="' + (isZero ? 'var(--success)' : 'var(--accent-2)') + '" stroke-width="3" stroke-dasharray="' + C + '" stroke-dashoffset="' + (C * (1 - pct)) + '" stroke-linecap="round"/>' +
        '</svg>' +
        '<div id="rest-bell-' + exercise.id + '" class="rest-bell' + (isZero ? ' show' : '') + '">' + ICONS.bell + '</div>' +
      '</div>' +
      '<span id="rest-time-' + exercise.id + '" class="rest-time mono' + (isZero ? ' finished' : '') + '">' + fmtClock(remaining) + '</span>' +
      '<div class="rest-actions">' +
        (running ?
          '<button class="rest-btn pause" id="rest-btn-' + exercise.id + '" data-action="rest-pause">Pausar</button>' :
          '<button class="rest-btn" id="rest-btn-' + exercise.id + '" data-action="rest-start">' + (isZero ? 'Repetir' : startLabel) + '</button>') +
        '<button class="rest-reset" data-action="rest-reset" aria-label="Reiniciar">' + ICONS.reset + '</button>' +
      '</div>' +
    '</div>';
  }

  /* ============================== EVENTOS DE TARJETA ============================== */

  function bindExerciseCardEvents(exId) {
    var card = document.getElementById('exercise-card-' + exId);
    if (!card) return;

    card.addEventListener('click', function (ev) {
      var actionEl = ev.target.closest('[data-action]');
      if (!actionEl) return;
      var action = actionEl.getAttribute('data-action');
      var setId = actionEl.getAttribute('data-set-id');
      if (action === 'delete-exercise') { deleteExercise(exId); }
      else if (action === 'toggle-explain') { toggleExplain(exId); }
      else if (action === 'add-set') { addSet(exId); }
      else if (action === 'remove-set') { removeSet(exId, setId); }
      else if (action === 'toggle-done') { toggleSetDone(exId, setId); }
      else if (action === 'set-type') { setExerciseType(exId, actionEl.getAttribute('data-type')); }
      else if (action === 'rest-start') { startRest(exId); }
      else if (action === 'rest-pause') { pauseRest(exId); }
      else if (action === 'rest-reset') { resetRest(exId); }
    });

    card.addEventListener('input', function (ev) {
      var field = ev.target.getAttribute('data-field');
      if (!field) return;
      var exercise = findExercise(exId);
      if (!exercise) return;
      var setId = ev.target.getAttribute('data-set-id');
      if (setId) {
        var s = exercise.sets.filter(function (x) { return x.id === setId; })[0];
        if (s) { s[field] = ev.target.value; saveRoutine(); }
        return;
      }
      if (field === 'restMinutes') {
        exercise.restSeconds = Math.max(0, Number(ev.target.value) || 0) * 60;
      } else if (field === 'restSeconds') {
        exercise.restSeconds = Math.max(0, Number(ev.target.value) || 0);
      } else {
        exercise[field] = field === 'explanation' ? ev.target.value.toUpperCase() : ev.target.value;
        if (field === 'explanation' && ev.target.value !== ev.target.value.toUpperCase()) {
          var pos = ev.target.selectionStart;
          ev.target.value = ev.target.value.toUpperCase();
          ev.target.setSelectionRange(pos, pos);
        }
      }
      saveRoutine();
    });
  }

  function refreshCard(exId) {
    var exercise = findExercise(exId);
    if (!exercise) return;
    var old = document.getElementById('exercise-card-' + exId);
    if (!old) return;
    var wrapper = document.createElement('div');
    wrapper.innerHTML = exerciseCardHTML(exercise);
    var fresh = wrapper.firstChild;
    old.replaceWith(fresh);
    bindExerciseCardEvents(exId);
    updateRestTimerUI(exId);
  }

  function toggleExplain(exId) {
    uiOpenExplain[exId] = !uiOpenExplain[exId];
    refreshCard(exId);
  }

  function setExerciseType(exId, type) {
    var exercise = findExercise(exId);
    if (!exercise) return;
    exercise.type = type;
    saveRoutine();
    refreshCard(exId);
  }

  function addSet(exId) {
    var exercise = findExercise(exId);
    if (!exercise) return;
    var last = exercise.sets[exercise.sets.length - 1];
    exercise.sets.push({ id: uid('set'), weight: last ? last.weight : '', reps: '', done: false });
    saveRoutine();
    refreshCard(exId);
  }
  function removeSet(exId, setId) {
    var exercise = findExercise(exId);
    if (!exercise) return;
    exercise.sets = exercise.sets.filter(function (s) { return s.id !== setId; });
    saveRoutine();
    refreshCard(exId);
  }
  function toggleSetDone(exId, setId) {
    var exercise = findExercise(exId);
    if (!exercise) return;
    var s = exercise.sets.filter(function (x) { return x.id === setId; })[0];
    if (!s) return;
    s.done = !s.done;
    saveRoutine();
    refreshCard(exId);
  }

  function deleteExercise(exId) {
    var day = routine[activeDay];
    day.exercises = day.exercises.filter(function (e) { return e.id !== exId; });
    saveRoutine();
    renderDay();
  }
  function addExercise() {
    var day = routine[activeDay];
    day.exercises.push(ex('Nuevo ejercicio', '10-12', 60, 3, 'AGREGUE AQUÍ LA EXPLICACIÓN TÉCNICA DEL MOVIMIENTO EN MAYÚSCULAS.'));
    saveRoutine();
    renderDay();
  }

  /* ============================== TEMPORIZADOR DE DESCANSO ============================== */

  function startRest(exId) {
    var exercise = findExercise(exId);
    if (!exercise) return;
    getAudioCtx();
    ensureNotifyPermission();
    var st = restTimers[exId] || {};
    var remaining = st.pausedRemaining != null ? st.pausedRemaining : exercise.restSeconds;
    if (remaining <= 0) remaining = exercise.restSeconds;
    restTimers[exId] = { endAt: Date.now() + remaining * 1000, pausedRemaining: null, running: true, beeped: false, justFinished: false };
    if (st.finishTimeoutId) clearTimeout(st.finishTimeoutId);
    updateRestTimerUI(exId);
  }
  function pauseRest(exId) {
    var st = restTimers[exId];
    if (!st || !st.running) return;
    var remaining = Math.max(0, Math.ceil((st.endAt - Date.now()) / 1000));
    st.running = false;
    st.pausedRemaining = remaining;
    updateRestTimerUI(exId);
  }
  function resetRest(exId) {
    var exercise = findExercise(exId);
    if (!exercise) return;
    var st = restTimers[exId];
    if (st && st.finishTimeoutId) clearTimeout(st.finishTimeoutId);
    restTimers[exId] = { endAt: null, pausedRemaining: exercise.restSeconds, running: false, beeped: false, justFinished: false };
    updateRestTimerUI(exId);
  }

  function updateRestTimerUI(exId) {
    var exercise = findExercise(exId);
    if (!exercise) return;
    var st = restTimers[exId];
    var running = st && st.running;
    var remaining = exercise.restSeconds;
    if (st) remaining = running ? Math.max(0, Math.ceil((st.endAt - Date.now()) / 1000)) : (st.pausedRemaining != null ? st.pausedRemaining : exercise.restSeconds);
    var isZero = remaining <= 0;

    if (running && isZero && st && !st.beeped) {
      st.beeped = true;
      st.running = false;
      st.pausedRemaining = 0;
      st.justFinished = true;
      playBeep();
      try { if (navigator.vibrate) navigator.vibrate([300, 120, 300, 120, 300, 120, 700]); } catch (e) {}
      notifyRestDone(exercise.name);
      st.finishTimeoutId = setTimeout(function () {
        var s2 = restTimers[exId];
        if (s2) s2.justFinished = false;
        var banner = document.getElementById('rest-banner-' + exId);
        var wrap = document.getElementById('rest-timer-' + exId);
        if (banner) banner.classList.remove('show');
        if (wrap) wrap.classList.remove('finished');
      }, 5000);
      running = false;
    }

    var wrap = document.getElementById('rest-timer-' + exId);
    var timeEl = document.getElementById('rest-time-' + exId);
    var circle = document.getElementById('rest-circle-' + exId);
    var bell = document.getElementById('rest-bell-' + exId);
    var banner = document.getElementById('rest-banner-' + exId);
    var btn = document.getElementById('rest-btn-' + exId);
    if (!wrap || !timeEl || !circle || !btn) return;

    var justFinished = st && st.justFinished;
    wrap.classList.toggle('finished', !!justFinished);
    timeEl.textContent = fmtClock(remaining);
    timeEl.classList.toggle('finished', isZero);
    if (bell) bell.classList.toggle('show', isZero);
    if (banner) banner.classList.toggle('show', !!justFinished);

    var R = 15.5, C = 2 * Math.PI * R;
    var pct = exercise.restSeconds > 0 ? Math.max(0, Math.min(1, remaining / exercise.restSeconds)) : 0;
    circle.setAttribute('stroke-dashoffset', C * (1 - pct));
    circle.setAttribute('stroke', isZero ? 'var(--success)' : 'var(--accent-2)');

    var isCardio = exercise.type === 'cardio';
    var startLabel = isCardio ? 'Cardio' : 'Descanso';
    if (running) {
      btn.textContent = 'Pausar';
      btn.className = 'rest-btn pause';
      btn.setAttribute('data-action', 'rest-pause');
    } else {
      btn.textContent = isZero ? 'Repetir' : startLabel;
      btn.className = 'rest-btn';
      btn.setAttribute('data-action', 'rest-start');
    }
  }

  setInterval(function () {
    var day = routine[activeDay];
    if (!day || day.isRest) return;
    day.exercises.forEach(function (e) {
      var st = restTimers[e.id];
      if (st && st.running) updateRestTimerUI(e.id);
    });
  }, 250);

  /* ============================== EXPORTAR ============================== */

  function buildSummary(day) {
    var lines = [];
    lines.push('WGYM ADN SPORT · TOCOPILLA');
    lines.push('RUTINA DE: SARA ENCALADA');
    lines.push('DÍA: ' + day.fullLabel + ' — ' + day.subtitle);
    lines.push('FECHA: ' + todayStr());
    lines.push('OBJETIVO CALÓRICO DEL DÍA: ' + day.kcal + ' kcal');
    lines.push('TIEMPO DE SESIÓN: ' + fmtClock(currentSessionElapsed()));
    lines.push('---------------------------------------------');
    day.exercises.forEach(function (exr, i) {
      lines.push((i + 1) + '. ' + exr.name.toUpperCase() + '  (objetivo: ' + exr.targetReps + ', ' + (exr.type === 'cardio' ? 'duración' : 'descanso') + ': ' + exr.restSeconds + 's)');
      exr.sets.forEach(function (s, si) {
        var w = s.weight === '' ? '-' : s.weight;
        var r = s.reps === '' ? '-' : s.reps;
        lines.push('   Serie ' + (si + 1) + ': ' + w + (exr.type === 'cardio' ? ' min' : ' kg') + ' × ' + r + (exr.type === 'cardio' ? ' lpm' : ' reps') + '  ' + (s.done ? '[HECHA]' : '[PENDIENTE]'));
      });
    });
    lines.push('---------------------------------------------');
    lines.push('Exportado desde la app de entrenamiento WGYM ADN SPORT.');
    return lines.join('\n');
  }

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  function exportDay() {
    var day = routine[activeDay];
    var text = buildSummary(day);
    var filename = 'wgym-sara-' + day.key + '-' + todayStr().replace(/\//g, '-') + '.txt';
    try {
      var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      showToast('Entrenamiento exportado');
    } catch (e) {
      openExportModal(text);
    }
  }

  function openExportModal(text) {
    var overlay = document.getElementById('modal-overlay');
    var ta = document.getElementById('modal-textarea');
    ta.value = text;
    overlay.classList.add('show');
    setTimeout(function () { ta.focus(); ta.select(); }, 50);
  }
  window.closeModal = function () { document.getElementById('modal-overlay').classList.remove('show'); };
  document.getElementById('modal-overlay').addEventListener('click', function (ev) {
    if (ev.target.id === 'modal-overlay') closeModal();
  });

  /* ============================== INICIO ============================== */

  renderShell();
})();
</script>
