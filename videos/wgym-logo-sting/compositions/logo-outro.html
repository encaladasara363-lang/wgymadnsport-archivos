<!-- hyperframes-registry-item: logo-outro -->
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Logo Outro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=block"
      rel="stylesheet"
    />
    <script src="../assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0a0a0a;
      }
    </style>
  </head>
  <body>
    <div
      id="logo-outro"
      data-composition-id="logo-outro"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="6.5"
    >
      <div class="canvas">
        <!-- Glow effect behind the logo -->
        <div class="logo-glow"></div>

        <!-- Logo Container -->
        <div class="logo-container">
          <img src="../assets/logo.jpeg" class="logo-img" alt="WGYMADNSPORT" />
        </div>

        <div class="text-container">
          <div class="tagline">21 DE MAYO 1520</div>
          <div class="subtag">TOCOPILLA</div>
        </div>
      </div>

      <style>
        [data-composition-id="logo-outro"] .canvas {
          width: 1080px;
          height: 1920px;
          background: radial-gradient(circle at 50% 38%, #171313 0%, #0a0a0a 65%);
          position: relative;
          overflow: hidden;
          font-family: "Inter", sans-serif;
        }

        [data-composition-id="logo-outro"] .logo-container {
          position: absolute;
          left: 50%;
          top: 44%;
          width: 460px;
          height: 460px;
          transform: translate(-50%, -50%) scale(0.6);
          opacity: 0;
          z-index: 2;
          border-radius: 50%;
          overflow: hidden;
          box-shadow: 0 0 0 4px rgba(230, 30, 60, 0.55), 0 0 60px 10px rgba(230, 30, 60, 0.25);
        }

        [data-composition-id="logo-outro"] .logo-img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
        }

        [data-composition-id="logo-outro"] .logo-glow {
          position: absolute;
          left: 50%;
          top: 44%;
          width: 700px;
          height: 700px;
          transform: translate(-50%, -50%);
          background: radial-gradient(circle, rgba(230, 30, 60, 0.35) 0%, rgba(10, 10, 10, 0) 70%);
          border-radius: 50%;
          opacity: 0;
          pointer-events: none;
          z-index: 1;
        }

        [data-composition-id="logo-outro"] .text-container {
          position: absolute;
          top: 74%;
          width: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
          z-index: 3;
        }

        [data-composition-id="logo-outro"] .tagline {
          font-family: "Bebas Neue", "Inter", sans-serif;
          font-size: 68px;
          letter-spacing: 6px;
          font-weight: 400;
          color: #ffffff;
          opacity: 0;
          margin-bottom: 14px;
          text-align: center;
        }

        [data-composition-id="logo-outro"] .subtag {
          font-family: "Inter", sans-serif;
          font-size: 26px;
          letter-spacing: 8px;
          font-weight: 600;
          color: #e61e3c;
          opacity: 0;
          text-align: center;
        }
      </style>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });

          const logo = '[data-composition-id="logo-outro"] .logo-container';
          const logoGlow = '[data-composition-id="logo-outro"] .logo-glow';
          const tagline = '[data-composition-id="logo-outro"] .tagline';
          const subtag = '[data-composition-id="logo-outro"] .subtag';

          // 1. Glow blooms first, subtly
          tl.fromTo(
            logoGlow,
            { opacity: 0, scale: 0.6 },
            { opacity: 0.9, scale: 1, duration: 0.6, ease: "power2.out" },
            0.1,
          );

          // 2. Logo dramatic zoom + fade reveal, impact moment at ~0.9s
          tl.fromTo(
            logo,
            { opacity: 0, scale: 0.55 },
            { opacity: 1, scale: 1.08, duration: 0.8, ease: "power4.out" },
            0.2,
          );
          tl.to(logo, { scale: 1, duration: 0.35, ease: "back.out(2)" }, 1.0);

          // 3. Glow settles down after impact
          tl.to(logoGlow, { opacity: 0.4, scale: 1.3, duration: 1.2, ease: "power2.out" }, 1.0);

          // 4. Direccion y subtitulo
          tl.fromTo(
            tagline,
            { opacity: 0, y: 24 },
            { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" },
            2.0,
          );
          tl.fromTo(
            subtag,
            { opacity: 0, y: 16 },
            { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
            2.35,
          );

          // 5. Hold, then gentle fade of everything at the end
          tl.to([logo, logoGlow, tagline, subtag], { opacity: 0, duration: 0.6, ease: "power1.in" }, 5.6);

          window.__timelines = window.__timelines || {};
          window.__timelines["logo-outro"] = tl;
        })();
      </script>

      <audio
        id="logo-beep"
        src="../assets/beep.mp3"
        data-start="0.9"
        data-duration="0.3"
        data-track-index="10"
        data-hf-media-start-basis="local"
      ></audio>
    </div>
  </body>
</html>
