<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>WGYMADNSPORT — Post Moderno</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #060606; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #060606; }
      .clip { position: absolute; inset: 0; }

      .scene-inner { position: absolute; inset: 0; overflow: hidden; background: #060606; }
      .world { position: absolute; inset: 0; transform-origin: 50% 50%; will-change: transform; }
      .bg-img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .top-scrim {
        position: absolute; inset: 0;
        background: linear-gradient(to bottom, rgba(6,6,6,0.55) 0%, rgba(6,6,6,0.05) 32%, rgba(6,6,6,0) 55%);
        pointer-events: none;
      }

      /* diagonal panel */
      #panel-layer { z-index: 20; }
      .panel {
        position: absolute; inset: -4% -4% -4% -4%;
        clip-path: polygon(0% 57%, 100% 44%, 100% 100%, 0% 100%);
        background: linear-gradient(155deg, rgba(10,8,8,0.72) 0%, rgba(10,6,6,0.94) 38%, #0a0505 100%);
        will-change: transform, opacity;
      }
      .panel-edge {
        position: absolute; left: -4%; right: -4%; top: 57%;
        height: 6px;
        background: linear-gradient(90deg, #e30613, #d4af37);
        transform: rotate(-7.4deg);
        transform-origin: 0% 0%;
        will-change: transform, opacity;
      }

      /* logo */
      #logo-layer { z-index: 40; }
      .logo-wrap {
        position: absolute; top: 56px; left: 56px; width: 108px; height: 108px; border-radius: 50%;
        box-shadow: 0 0 0 3px rgba(227,6,19,0.65), 0 16px 36px rgba(0,0,0,0.55);
        overflow: hidden; will-change: transform, opacity;
      }
      .logo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }

      /* headline */
      #headline-layer { z-index: 30; }
      .head-wrap { position: absolute; left: 70px; top: 672px; width: 940px; }
      .head-line { font-family: 'Bebas Neue', sans-serif; font-weight: 400; text-transform: uppercase;
        font-size: 74px; line-height: 1.05; letter-spacing: 0.01em; color: #f5f5f5;
        text-shadow: 0 6px 24px rgba(0,0,0,0.6); will-change: transform, opacity; }
      .head-line.accent { color: #ff5a5a; margin-top: 10px; }

      #tag-layer { z-index: 30; }
      .tag-wrap { position: absolute; left: 70px; top: 862px; width: 940px; }
      .tag { font-family: 'Bebas Neue', sans-serif; font-weight: 400; text-transform: uppercase;
        font-size: 32px; letter-spacing: 0.02em; color: #e9e4e0; will-change: transform, opacity; }
      .tag span { color: #e30613; }

      #addr-layer { z-index: 30; }
      .addr-wrap { position: absolute; left: 70px; top: 950px; }
      .addr { display: inline-flex; align-items: center; gap: 12px; padding: 16px 28px; border-radius: 999px;
        background: rgba(255,255,255,0.06); border: 1.5px solid rgba(245,245,245,0.3);
        font-family: Inter, sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 0.04em;
        color: #f5f5f5; text-transform: uppercase; will-change: transform, opacity; }
      .addr .pin { color: #e30613; font-size: 22px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1080" data-duration="3.2">
      <section class="clip" id="scene" data-start="0" data-duration="3.2" data-track-index="0">
        <div class="scene-inner">
          <div class="world" id="world" data-layout-allow-overflow>
            <img class="bg-img" src="assets/foto-maquinas.jpg" alt="" />
          </div>
          <div class="top-scrim"></div>
        </div>
      </section>

      <div class="clip" id="panel-layer" data-start="0" data-duration="3.2" data-track-index="10">
        <div class="panel" id="panel" data-layout-allow-overflow></div>
        <div class="panel-edge" id="panel-edge" data-layout-allow-overflow></div>
      </div>

      <div class="clip" id="logo-layer" data-start="0" data-duration="3.2" data-track-index="40">
        <div class="logo-wrap" id="logo-wrap"><img src="assets/logo.jpg" alt="WGYMADNSPORT" /></div>
      </div>

      <div class="clip" id="headline-layer" data-start="0" data-duration="3.2" data-track-index="30">
        <div class="head-wrap">
          <div class="head-line" id="h1">EL CARDIO SUMA AÑOS.</div>
          <div class="head-line accent" id="h2">LAS PESAS LES DAN VIDA.</div>
        </div>
      </div>

      <div class="clip" id="tag-layer" data-start="0" data-duration="3.2" data-track-index="30">
        <div class="tag-wrap">
          <div class="tag" id="tag">"La perseverancia es el secreto de <span>tu éxito</span>"</div>
        </div>
      </div>

      <div class="clip" id="addr-layer" data-start="0" data-duration="3.2" data-track-index="30">
        <div class="addr-wrap">
          <div class="addr" id="addr"><span class="pin">&#9679;</span>WGYMADNSPORT &middot; 21 de Mayo 1520</div>
        </div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      /* drone-style continuous push-in on the photo */
      const world = document.getElementById("world");
      const cam = { scale: 1, x: 0, y: 0 };
      const applyCam = () => { world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`; };
      applyCam();
      tl.to(cam, { scale: 1.12, x: -18, y: 10, duration: 3.2, ease: "power1.inOut", onUpdate: applyCam }, 0);

      /* diagonal panel + accent edge slide in */
      tl.fromTo("#panel", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.15);
      tl.fromTo("#panel-edge", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.55);

      /* logo pop */
      tl.fromTo("#logo-wrap", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.2);

      /* kinetic headline slam */
      tl.fromTo("#h1", { y: 46, opacity: 0, rotate: -2 }, { y: 0, opacity: 1, rotate: 0, duration: 0.5, ease: "power3.out" }, 0.7);
      tl.fromTo("#h2", { y: 46, opacity: 0, rotate: -2 }, { y: 0, opacity: 1, rotate: 0, duration: 0.5, ease: "power3.out" }, 0.85);

      /* tagline + address */
      tl.fromTo("#tag", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 1.35);
      tl.fromTo("#addr", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 1.55);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
