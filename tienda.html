<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<meta name="robots" content="noindex">
<title>Tienda WGYM</title>
<link rel="icon" href="assets/logo-oficial.webp">
<link rel="apple-touch-icon" href="assets/logo-oficial.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,500;0,700;0,800;1,700;1,800&family=Rubik+Distressed&display=swap" rel="stylesheet">
<!--
  🛒 Tienda WGYM (24-10-2026, la dueña: "quiero empezar a vender otros productos en mi gimnasio… una app que se vea
  cuánto vendí, cuánta plata le saco, el inventario, que se descuente cada vez que venda algo, y escanear con mi
  celular"). Solo para la dueña: pide la clave de administración (la misma del mesón, guardada en el equipo).
  Todo se guarda en la planilla de Google (hojas «Tienda productos» y «Tienda movimientos», acciones tienda* de
  docs/apps-script/Ingresos.gs), así el celular y la compu ven el mismo inventario. Sin señal, las ventas quedan
  en el teléfono y se envían solas al volver la conexión (nunca se descuentan dos veces: cada venta lleva un id).
-->
<style>
:root{ --bg:#0A0A0B; --card:#141417; --card2:#1C1C21; --line:#2A2A31; --red:#E30613; --red2:#FF3B47; --gold:#D4AF37; --yel:#F5D547; --txt:#F4F4F6; --muted:#A3A3AD; --ok:#2ECC71; --warn:#F5A623;
 --tit:"Rubik Distressed", "Anton", Impact, sans-serif; --num:"Anton", Impact, sans-serif; --cond:"Barlow Condensed", "Arial Narrow", sans-serif; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; background:var(--bg); color:var(--txt); font-family:var(--cond); font-size:18px; font-weight:700; }
body{ min-height:100vh; padding-bottom:calc(84px + env(safe-area-inset-bottom)); background:radial-gradient(1200px 500px at 50% -200px, #2a0306 0%, transparent 60%), repeating-linear-gradient(135deg, rgba(255,255,255,.015) 0 2px, transparent 2px 14px), var(--bg); }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
.wrap{ max-width:760px; margin:0 auto; padding:0 16px; }
header.top{ display:flex; align-items:center; gap:12px; padding:14px 16px 10px; max-width:760px; margin:0 auto; }
header.top img{ width:54px; height:54px; border-radius:50%; border:2px solid var(--gold); object-fit:cover; background:#000; }
header.top h1{ font-family:var(--tit); font-weight:400; font-size:30px; margin:0; letter-spacing:.02em; text-transform:uppercase; line-height:1; }
header.top h1 span{ color:var(--yel); }
header.top small{ display:block; color:var(--muted); font-size:14px; letter-spacing:.06em; text-transform:uppercase; margin-top:3px; }
.franja{ height:6px; background:linear-gradient(90deg, var(--red) 0 70%, var(--gold) 70% 100%); max-width:760px; margin:0 auto 12px; }
#sync{ margin-left:auto; font-size:13px; padding:5px 10px; border-radius:999px; background:var(--card2); border:1px solid var(--line); white-space:nowrap; }
#sync.pend{ background:#3a2a05; border-color:var(--warn); color:var(--yel); }
#sync.err{ background:#3a0207; border-color:var(--red); color:#FF8A8F; }
h2{ font-family:var(--tit); font-weight:400; text-transform:uppercase; font-size:26px; margin:18px 0 10px; display:flex; align-items:center; gap:10px; }
h2::before{ content:""; width:8px; height:26px; background:var(--red); transform:skewX(-18deg); display:inline-block; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin:10px 0; }
.card.oro{ border-color:var(--gold); }
.muted{ color:var(--muted); font-weight:500; }
.btn{ display:block; width:100%; border:0; border-radius:14px; padding:14px 16px; font-size:20px; font-weight:800; font-style:italic; text-transform:uppercase; letter-spacing:.03em; background:var(--card2); border:1px solid var(--line); text-align:center; }
.btn.rojo{ background:linear-gradient(180deg, var(--red2), var(--red)); border-color:var(--red); color:#fff; box-shadow:0 4px 0 #8a020b; }
.btn.oro{ background:var(--yel); color:#141416; border-color:var(--gold); }
.btn.verde{ background:linear-gradient(180deg, #3ee07f, #1fa856); border-color:#1fa856; color:#062312; box-shadow:0 4px 0 #0d6b33; }
.btn.chico{ font-size:15px; padding:9px 12px; width:auto; display:inline-block; border-radius:10px; }
.btn:disabled{ opacity:.45; }
.fila{ display:flex; gap:8px; align-items:center; }
.fila > *{ flex:1; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.inp{ width:100%; background:#0F0F12; border:2px solid var(--line); border-radius:12px; padding:12px; font-size:19px; font-weight:700; outline:none; }
.inp:focus{ border-color:var(--gold); }
.inp.amarillo{ background:var(--yel); color:#141416; border-color:var(--gold); }
.inp.amarillo::placeholder{ color:#5A4A10; }
label.lab{ display:block; font-size:14px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin:10px 0 4px; }
nav#nav{ position:fixed; left:0; right:0; bottom:0; background:#0D0D10; border-top:1px solid var(--line); display:flex; justify-content:space-around; padding:6px 4px calc(6px + env(safe-area-inset-bottom)); z-index:20; }
nav#nav button{ background:none; border:0; color:var(--muted); font-size:13px; font-weight:800; text-transform:uppercase; display:flex; flex-direction:column; align-items:center; gap:2px; padding:4px 6px; min-width:64px; }
nav#nav button b{ font-size:24px; line-height:1; }
nav#nav button[aria-pressed="true"]{ color:var(--red2); }
.prod{ display:flex; gap:12px; align-items:center; }
.prod .ph{ width:58px; height:58px; border-radius:12px; background:var(--card2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:28px; overflow:hidden; flex:none; }
.prod .ph img{ width:100%; height:100%; object-fit:cover; }
.prod .tx{ flex:1; min-width:0; }
.prod .tx b{ display:block; font-size:19px; text-transform:uppercase; line-height:1.1; overflow-wrap:anywhere; }
.prod .tx span{ overflow-wrap:anywhere; }
.prod .tx span{ display:block; font-size:14px; color:var(--muted); font-weight:500; }
.pill{ display:inline-block; font-size:13px; padding:3px 9px; border-radius:999px; background:var(--card2); border:1px solid var(--line); margin:4px 4px 0 0; }
.pill.bajo{ background:#3a0207; border-color:var(--red); color:#FF8A8F; }
.pill.ok{ background:#0B2A14; border-color:#1fa856; color:#7CE39A; }
.pill.oro{ background:var(--yel); color:#141416; border-color:var(--gold); }
.precio{ font-family:var(--num); font-size:24px; color:var(--yel); white-space:nowrap; }
.chips{ display:flex; gap:8px; overflow-x:auto; padding:2px 0 8px; }
.pk-it{ display:flex !important; width:100%; align-items:center; gap:10px; text-align:left; margin:4px 0; border-radius:12px !important; padding:6px 10px !important; }
.pk-ph{ flex:none; width:52px; height:68px; border-radius:8px; background:#fff; display:grid; place-items:center; overflow:hidden; font-size:28px; }
.pk-ph img{ width:100%; height:100%; object-fit:contain; }
.pk-sel{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
.pk-chip{ flex:none; display:flex; align-items:center; gap:8px; max-width:230px; background:#2a2205; border:2px solid var(--gold); border-radius:12px; padding:6px 8px; color:var(--txt); font-weight:800; text-transform:uppercase; font-size:14px; text-align:left; }
.pk-chip small{ display:block; font-weight:600; color:var(--yel); font-size:12px; }
.pk-chip b{ color:#FF8A8F; font-size:18px; }
.chip.desc{ background:#FFD400; color:#000; border-color:#000; }
.pk-chip i{ font-style:normal; color:#7CE39A; font-size:20px; padding:0 4px; }
.chip{ flex:none; border-radius:999px; padding:8px 14px; background:var(--card2); border:1px solid var(--line); font-size:15px; font-weight:800; text-transform:uppercase; }
.chip[aria-pressed="true"]{ background:var(--red); border-color:var(--red); color:#fff; }
.kpis{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.kpi{ background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:12px; }
.kpi small{ display:block; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
.kpi b{ display:block; font-family:var(--num); font-size:28px; font-weight:400; color:var(--yel); margin-top:4px; }
.kpi.verde b{ color:#7CE39A; }
.barra{ height:14px; border-radius:999px; background:#0F0F12; border:1px solid var(--line); overflow:hidden; margin:8px 0 4px; }
.barra i{ display:block; height:100%; background:linear-gradient(90deg, var(--red), var(--gold)); }
.carro-it{ display:grid; grid-template-columns:1fr auto; gap:6px; padding:10px 0; border-bottom:1px solid var(--line); }
.carro-it:last-child{ border-bottom:0; }
.cant{ display:flex; align-items:center; gap:6px; }
.cant button{ width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--card2); font-size:22px; font-weight:800; }
.cant b{ min-width:28px; text-align:center; font-family:var(--num); font-size:22px; font-weight:400; }
.total{ display:flex; justify-content:space-between; align-items:baseline; font-size:22px; text-transform:uppercase; margin:10px 0; }
.total b{ font-family:var(--num); font-weight:400; font-size:38px; color:var(--yel); }
.pagos{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:8px 0; }
.pagos button{ border-radius:12px; padding:12px 6px; background:var(--card2); border:2px solid var(--line); font-size:17px; font-weight:800; text-transform:uppercase; }
.pagos button[aria-pressed="true"]{ background:var(--yel); color:#141416; border-color:var(--gold); }
.lista-p{ max-height:340px; overflow:auto; border:1px solid var(--line); border-radius:12px; margin-top:8px; }
.lista-p button{ display:flex; width:100%; gap:10px; align-items:center; text-align:left; background:none; border:0; border-bottom:1px solid var(--line); padding:10px; }
.lista-p button:last-child{ border-bottom:0; }
.lista-p .n{ flex:1; min-width:0; }
.lista-p .n small{ display:block; color:var(--muted); font-weight:500; font-size:13px; }
#toast{ position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#111; border:2px solid var(--gold); color:#fff; padding:12px 18px; border-radius:14px; z-index:60; font-size:17px; max-width:92vw; text-align:center; display:none; }
.velo{ position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:40; display:flex; align-items:flex-end; justify-content:center; }
.velo[hidden]{ display:none; }
.hoja{ background:var(--card); border-top:3px solid var(--gold); border-radius:20px 20px 0 0; width:100%; max-width:760px; max-height:92vh; max-height:calc(92vh / 1.22); overflow:auto; padding:16px 16px calc(20px + env(safe-area-inset-bottom)); }
.hoja .cab{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
/* El título con «← Volver» queda pegado arriba al bajar por la ficha (27-10-2026, la dueña: "debería haber un botón volver"). */
.hoja .cab{ position:sticky; top:-16px; z-index:5; background:var(--card); margin:-16px -16px 8px; padding:14px 16px 10px; border-bottom:1px solid var(--line); }
.btn.chico.volver{ background:#FFD400; color:#000; border-color:#000; flex:none; }
.hoja h3{ font-family:var(--tit); font-weight:400; text-transform:uppercase; font-size:24px; margin:0; }
.cam{ position:relative; border-radius:16px; overflow:hidden; background:#000; aspect-ratio:4/3; border:2px solid var(--gold); }
.cam video{ width:100%; height:100%; object-fit:cover; display:block; }
.cam .marco{ position:absolute; left:6%; right:6%; top:30%; bottom:30%; border:3px solid rgba(245,213,71,.9); border-radius:12px; box-shadow:0 0 0 999px rgba(0,0,0,.35); }
.cam .laser{ position:absolute; left:8%; right:8%; top:50%; height:2px; background:var(--red2); box-shadow:0 0 12px var(--red2); animation:laser 1.6s ease-in-out infinite; }
@keyframes laser{ 0%,100%{ transform:translateY(-38px); } 50%{ transform:translateY(38px); } }
.cam .flash{ position:absolute; left:0; right:0; bottom:0; background:rgba(31,168,86,.95); color:#fff; padding:10px; text-align:center; font-size:18px; display:none; }
.mov{ display:flex; justify-content:space-between; gap:8px; padding:9px 0; border-bottom:1px solid var(--line); font-size:16px; }
.mov:last-child{ border-bottom:0; }
.mov .d{ flex:1; min-width:0; }
.mov .d small{ display:block; color:var(--muted); font-weight:500; font-size:13px; }
.mov.anulada{ opacity:.45; text-decoration:line-through; }
.x{ background:none; border:0; font-size:20px; padding:0 4px; }
.aviso{ background:#3a2a05; border:1px solid var(--warn); color:var(--yel); border-radius:12px; padding:10px 12px; font-size:16px; margin:8px 0; }
.err{ background:#3a0207; border:1px solid var(--red); color:#FF8A8F; border-radius:12px; padding:10px 12px; font-size:16px; margin:8px 0; }
.gate{ max-width:420px; margin:40px auto; text-align:center; padding:0 16px; }
.gate img{ width:120px; height:120px; border-radius:50%; border:3px solid var(--gold); object-fit:cover; }
.gate h1{ font-family:var(--tit); font-weight:400; font-size:40px; text-transform:uppercase; margin:12px 0 4px; }
table.top{ width:100%; border-collapse:collapse; font-size:16px; }
table.top td{ padding:7px 4px; border-bottom:1px solid var(--line); }
table.top td.r{ text-align:right; font-family:var(--num); font-weight:400; color:var(--yel); white-space:nowrap; }
.etq-sel{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); }
.etq-sel .n{ flex:1; min-width:0; }
.etq-ph{ width:64px; height:84px; flex:none; border-radius:10px; background:#fff; object-fit:contain; display:flex; align-items:center; justify-content:center; font-size:30px; }
.etq-sel input[type=number]{ width:70px; }
#hojaEtiquetas{ display:none; }
/* Letras más grandes y pastillas legibles (24-10-2026, la dueña: "eso no se nota nada, pon letras negras y haz el zoom
   más grande que puedas de todas las letras"). Las pastillas de color van con letra negra o clara bien marcada. */
html{ -webkit-text-size-adjust:100%; }
body{ zoom:1.22; }
.prod .tx span.pill{ display:inline-block; font-size:20px; font-weight:800; padding:5px 12px; margin:6px 6px 0 0; color:var(--txt); }
.pills{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.pills .pill{ font-size:20px; font-weight:800; padding:6px 14px; margin:0; white-space:nowrap; color:var(--txt); }
.pills .pill.oro{ background:var(--yel); color:#000; border-color:var(--gold); }
.pills .pill.ok{ background:#2ECC71; color:#000; border-color:#1fa856; }
.pills .pill.bajo{ background:#FF3B47; color:#000; border-color:var(--red); }
.pill.nueva, .pills .pill.nueva{ background:#7CE39A; color:#000; border-color:#1fa856; }
.pill.pronto, .pills .pill.pronto{ background:#5BC0FF; color:#000; border-color:#1E90FF; }
.pill.amer, .pills .pill.amer{ background:#D4AF37; color:#000; border-color:#FFD400; }
.prod .tx .precio{ color:var(--yel); font-size:26px; }
.prod .tx span.pill.oro{ background:var(--yel); color:#000; border-color:var(--gold); }
.prod .tx span.pill.ok{ background:#2ECC71; color:#000; border-color:#1fa856; }
.prod .tx span.pill.bajo{ background:#FF3B47; color:#000; border-color:var(--red); }
.muted, .prod .tx span{ color:#CFCFD6; }
/* La foto del producto se ve entera, sin recortar (24-10-2026, la dueña: "que se vea entera"). */
.prod .ph{ width:78px; height:104px; background:#fff; }
.prod .ph img{ cursor:zoom-in; }
.prod .ph{ position:relative; }
.card.vendida .prod .ph img{ filter:grayscale(1) brightness(.6); }
.sello-v{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) rotate(-14deg); font-family:'Rubik Distressed','Anton',sans-serif; font-size:15px; color:#fff; background:#E30613; border:2px solid #fff; padding:1px 5px; border-radius:6px; pointer-events:none; }
.pills .pill.vend{ background:#E30613; color:#fff; border-color:#fff; }
#fotoGrande{ position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,.92); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; }
#fotoGrande img{ max-width:100%; max-height:calc(100vh / 1.22 - 190px); object-fit:contain; border-radius:14px; background:#fff; }
#fotoGrande b{ color:#fff; font-size:20px; text-transform:uppercase; margin-top:12px; text-align:center; }
#fotoGrande span{ color:#CFCFD6; font-size:15px; margin-top:6px; }
#fotoGrande .volver{ margin-top:16px; background:#FFD400; color:#000; border:0; border-radius:12px; padding:14px 34px; font:800 italic 22px "Barlow Condensed",sans-serif; text-transform:uppercase; cursor:pointer; }
#fotoGrande b br{ display:block; }
.prod .ph img{ object-fit:contain; }
.ph-pack{ display:grid; width:100%; height:100%; gap:2px; background:#fff; }
.ph-pack.n2{ grid-template-columns:1fr 1fr; }
.ph-pack.n3, .ph-pack.n4{ grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; }
.ph-pack img{ width:100%; height:100%; min-height:0; min-width:0; object-fit:cover !important; }
#fotoGrande .fg-pack{ display:flex; gap:6px; max-width:100%; justify-content:center; }
#fotoGrande .fg-pack img{ min-width:0; flex:1 1 0; max-width:48%; max-height:calc(100vh / 1.22 - 190px); }
/* El botón Guardar de las fichas queda siempre a la vista, abajo (24-10-2026: la dueña cambió el precio y no vio
   el Guardar, que estaba más abajo; el cambio no se guardó). */
.hoja #fOk, .hoja #eOk{ position:sticky; bottom:0; z-index:3; box-shadow:0 -10px 18px rgba(0,0,0,.55), 0 4px 0 #8a020b; }
@media print{ body{ zoom:1; } }
@media print{
 body{ background:#fff !important; padding:0; }
 body > *:not(#hojaEtiquetas){ display:none !important; }
 #hojaEtiquetas{ display:grid !important; grid-template-columns:repeat(3, 1fr); gap:0; width:190mm; margin:0 auto; }
 .etq{ border:1px dashed #bbb; height:34mm; padding:2mm 3mm; color:#000; font-family:Arial, sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden; page-break-inside:avoid; }
 .etq b{ font-size:9pt; text-transform:uppercase; text-align:center; line-height:1.1; max-height:2.3em; overflow:hidden; }
 .etq .det{ font-size:10.5pt; font-weight:900; text-transform:uppercase; text-align:center; line-height:1.1; background:#000; color:#fff; padding:0 2mm; border-radius:1mm; margin:.5mm 0; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
 .etq .pr{ font-size:12pt; font-weight:900; }
 .etq .fila-pr{ display:flex; align-items:center; justify-content:center; gap:2mm; }
 .etq .tp{ font-size:12pt; font-weight:900; letter-spacing:.5pt; border:.6mm solid #000; border-radius:1mm; padding:0 1.5mm; line-height:1.15; }
 .etq svg{ width:44mm; height:13mm; }
 @page{ size:A4; margin:10mm; }
 /* Hoja adhesiva chica de 5 × 7 cm, lisa: 2 etiquetas de 5 × 3,5 cm por hoja, para recortar por la línea
    (26-10-2026, pedido de la dueña para el maní). El tamaño de página se pone al imprimir (#pagEtq). */
 #hojaEtiquetas.fchica{ grid-template-columns:1fr; width:50mm; margin:0; }
 #hojaEtiquetas.fchica .etq{ height:35mm; box-sizing:border-box; padding:1.5mm 2mm; border:none; border-bottom:1px dashed #bbb; }
 #hojaEtiquetas.fchica .etq:nth-child(2n){ border-bottom:none; page-break-after:always; }
 #hojaEtiquetas.fchica .etq b{ font-size:8pt; }
 #hojaEtiquetas.fchica .etq .det{ font-size:9pt; }
 #hojaEtiquetas.fchica .etq .pr{ font-size:11pt; }
 #hojaEtiquetas.fchica .etq svg{ width:44mm; height:12mm; }
}
</style>
</head>
<body>
<div id="gate" class="gate" hidden>
 <img src="assets/logo-oficial.webp" alt="WGYM">
 <h1>Tienda <span style="color:var(--yel)">WGYM</span></h1>
 <p class="muted">Ventas e inventario de los productos del gimnasio. Escribe la clave de administración (la misma del mesón).</p>
 <input class="inp" id="gClave" type="password" autocomplete="current-password" placeholder="Clave de administración" style="text-align:center">
 <p class="err" id="gErr" hidden></p>
 <button class="btn rojo" id="gOk" style="margin-top:12px">Entrar</button>
</div>

<div id="app" hidden>
 <header class="top">
  <img src="assets/logo-oficial.webp" alt="WGYM">
  <div><h1>Tienda <span>WGYM</span></h1><small id="subTit">Ventas e inventario</small></div>
  <span id="sync">✅ Al día</span>
 </header>
 <div class="franja"></div>
 <main class="wrap" id="vista"></main>
</div>

<nav id="nav" hidden>
 <button data-tab="vender" aria-pressed="true"><b>🛒</b>Vender</button>
 <button data-tab="inv"><b>📦</b>Inventario</button>
 <button data-tab="res"><b>📊</b>Resumen</button>
 <button data-tab="fiados"><b>📒</b>Fiados</button>
 <button data-tab="cod"><b>🏷</b>Códigos</button>

<script>
(function(){
"use strict";
var CHECKIN_URL = "https://script.google.com/macros/s/AKfycbzDpqUW70UbZTQtH8X20EDdAGdQQbxBoKebYg2eDwX42A3yCXEpKacpnjtp8RjkBcNq/exec";
var CLAVE_ADMIN_LS = "wgym_clave_admin_v1";          /* la misma del mesón: en la compu de recepción ya está guardada */
var CLAVE_CACHE = "wgym_tienda_cache_v1";           /* última foto del inventario, para abrir al instante y sin señal */
var CLAVE_PEND = "wgym_tienda_pend_v1";             /* ventas / entradas que no alcanzaron a llegar a la planilla */
var CATS = [["Bebestibles","🥤"],["Snacks","🍫"],["Suplementos","💊"],["Accesorios","🧤"],["Ropa mujer","👚"],["Ropa hombre","👕"],["Zapatillas","👟"],["Packs","🎁"],["Otro","📦"]];
var PAGOS = [["efectivo","💵 Efectivo"],["transferencia","🏦 Transferencia"],["tarjeta","💳 Tarjeta"],["fiado","📒 Fiado"]];

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function plata(n){ n = Math.round(Number(n) || 0); return (n < 0 ? "-$" : "$") + String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
function num(v){ var n = parseFloat(String(v == null ? "" : v).replace(/\./g, "").replace(",", ".")); return isNaN(n) ? 0 : n; }
function lsGet(k, d){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function hoyISO(){ return new Intl.DateTimeFormat("en-CA", { timeZone:"America/Santiago" }).format(new Date()); }
function ahoraTxt(){ var f = new Intl.DateTimeFormat("sv-SE", { timeZone:"America/Santiago", year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit" }).format(new Date()); return f.replace("T", " ").slice(0, 16); }
function normTxt(s){ return String(s || "").toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
/* Al cambiar una foto en img/tienda/ (mismo nombre), subir FOTO_V para que los teléfonos no muestren la antigua. */
var FOTO_V = "49";
function fotoUrl(f){ return f ? f + (f.indexOf("?") < 0 ? "?v=" + FOTO_V : "") : ""; }
function iconoCat(c){ var x = CATS.filter(function(k){ return k[0] === c; })[0]; return x ? x[1] : "📦"; }
function toast(t, ms){ var el = $("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(function(){ el.style.display = "none"; }, ms || 2600); }
function vibrar(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms || 30); }catch(e){} }

/* ═══ Datos ═══ */
var clave = ""; try{ clave = localStorage.getItem(CLAVE_ADMIN_LS) || ""; }catch(e){}
var S = lsGet(CLAVE_CACHE, null) || { productos:[], movs:[], total:{ ventas:0, ganancia:0, invertido:0 }, hoy:hoyISO() };
var pend = lsGet(CLAVE_PEND, []);
var tab = "vender", carro = [], pagoSel = "efectivo", cuotaPago = "efectivo";
function sumarDias(f, n){ return new Date(new Date(f + "T12:00:00").getTime() + n * 86400000).toISOString().slice(0, 10); }

function api(action, params){
 var cuerpo = new URLSearchParams(Object.assign({ action:action, clave:clave }, params || {}));
 return fetch(CHECKIN_URL, { method:"POST", body:cuerpo }).then(function(r){ return r.json(); }).then(function(d){
  if(d && d.ok) return d;
  var e = new Error((d && d.error) || "no se pudo"); e.motivo = d && d.error; throw e;
 });
}
function guardarCache(){ lsSet(CLAVE_CACHE, S); }
/* Lo que todavía no llegó a la planilla se vuelve a aplicar sobre la lista que manda la planilla. */
function aplicarPendientes(){
 /* «Bebidas» se llama «Bebestibles» desde el 24-10-2026 (pedido de la dueña); lo guardado antes se muestra con el nombre nuevo. */
 /* «Ropa deportiva» se separó en «Ropa mujer» y «Ropa hombre» (24-10-2026, la dueña: "esta es ropa de hombre"); lo guardado antes era de mujer. */
 S.productos.forEach(function(p){ p.cat = catNueva(p.cat); if(!p.ext || typeof p.ext !== "object") p.ext = {}; });
 pend.forEach(function(p){
  if(p.tipo === "venta") p.datos.items.forEach(function(it){ descontar(it.id, it.cant); });
  if(p.tipo === "entrada"){ var q = prod(p.datos.id); if(q) q.stock += p.datos.cant; }
 });
}
function movsPendientes(){
 var l = [];
 pend.forEach(function(p){
  if(p.tipo === "venta") p.datos.items.forEach(function(it){ var q = prod(it.id) || {}; l.push({ f:p.f, tipo:"venta", vid:p.datos.vid, id:it.id, n:q.n || "", cant:it.cant, precio:it.precio, costo:q.costo || 0, total:it.cant * it.precio, pago:p.datos.pago, cliente:p.datos.cliente || "", est:p.datos.pago === "fiado" ? "fiado" : "", pend:true }); });
  if(p.tipo === "entrada" && p.datos.tipo === "ajuste"){ var q = prod(p.datos.id) || {}; l.push({ f:p.f, tipo:"ajuste", vid:"", id:p.datos.id, n:q.n || "", cant:p.datos.cant, precio:0, costo:q.costo || 0, total:0, pago:"", cliente:"", nota:p.datos.nota || "", est:"", pend:true }); }
  if(p.tipo === "abono") l.push({ f:p.f, tipo:"abono", vid:p.datos.vid, id:"", n:"Abono de fiado", cant:0, precio:0, costo:0, total:p.datos.monto, pago:p.datos.pago, cliente:"", nota:"", est:"", pend:true });
 });
 return l;
}
function prod(id){ for(var i = 0; i < S.productos.length; i++) if(S.productos[i].id === id) return S.productos[i]; return null; }
function porCodigo(cod){ cod = String(cod || "").replace(/\s/g, ""); var b = cod.replace(/^0+/, "");
 for(var i = 0; i < S.productos.length; i++){ var p = S.productos[i]; if(!p.activo || !p.cod) continue; if(p.cod === cod || p.cod.replace(/^0+/, "") === b) return p; } return null; }
function activos(){ return S.productos.filter(function(p){ return p.activo && !retirada(p); }); }
/* 🏷 Ropa vendida (26-10-2026, la dueña: casi toda la ropa es de una sola prenda; "cuando se venda una prenda que se
   coloque vendido automático y que se quede en la tienda por 15 días y luego la eliminas"): una prenda sin stock con
   una venta muestra «VENDIDO» y desaparece 15 días después de esa venta. Solo se esconde en pantalla (la planilla no
   se toca): si se anula la venta, el stock vuelve y la prenda reaparece sola. */
var DIAS_VENDIDO = 15;
function ultimaVenta(id){ var u = ""; todosMovs().forEach(function(m){ if(m.est !== "anulada" && m.id === id && (m.tipo === "venta" || (m.tipo === "ajuste" && /^PACK /.test(m.nota || ""))) && m.f.slice(0, 10) > u) u = m.f.slice(0, 10); }); return u; }
function ropaVendida(p){ if(!esUnica(p) || stockVer(p) > 0) return null; var u = ultimaVenta(p.id); if(!u) return null; var d = -diasHasta(u); return { f:u, dias:d, quedan:Math.max(0, DIAS_VENDIDO - d) }; }
function retirada(p){ var v = ropaVendida(p) || packDesarmado(p); return !!v && v.dias > DIAS_VENDIDO; }
/* 🧩 Pack desarmado (27-10-2026, la dueña eligió la recomendación): si una prenda única de un pack se vendió por separado,
   el pack ya no se puede vender: sale en gris «Se desarmó…», no se puede agregar a la venta (ni sale en la vitrina, con
   la Versión 27) y 15 días después se quita solo. Los packs de productos que se reponen solo quedan SIN STOCK. */
function packDesarmado(p){
 if(!esPack(p) || !esUnica(p) || stockPack(p) > 0 || ultimaVenta(p.id)) return null;
 var falta = partesPack(p).filter(function(x){ return !x.p || !x.p.activo || x.p.stock < x.c; })[0]; if(!falta) return null;
 var u = falta.p ? ultimaVenta(falta.p.id) : ""; if(!u && falta.p) return null;
 var d = u ? -diasHasta(u) : 0;
 return { parte:falta.p ? falta.p.n : "una prenda", f:u, dias:d, quedan:Math.max(0, DIAS_VENDIDO - d) };
}
/* 🥤 Batidos del mismo tarro (26-10-2026, la dueña: el ganador de masa y el batido normal "tienen diferente valor"; eligió
   que el ganador descuente solo del tarro): un producto cuyo nombre calza con «de» no lleva stock propio; cada venta suya
   anota además un ajuste de −1 porción en el producto «base» (el que lleva el stock real del tarro). Al anular la venta,
   la porción vuelve. Para sumar otro batido del mismo tarro, agregar su regla aquí. */
var USA_PORCION = [{ de:/^batido ganador/i, base:/^batido de prote/i }];
function basePorcion(p){
 if(!p || !p.n) return null;
 for(var i = 0; i < USA_PORCION.length; i++){ var r = USA_PORCION[i]; if(!r.de.test(p.n)) continue;
  var b = S.productos.filter(function(q){ return q.activo && q.id !== p.id && r.base.test(q.n); })[0]; if(b) return b; }
 return null;
}
function stockVer(p){ if(esPack(p)) return stockPack(p); var b = basePorcion(p); return b ? b.stock : p.stock; }
/* 🎁 Packs (27-10-2026, la dueña eligió la idea 25): un producto armado con otros (ext.pack = [{id, c}]). No lleva stock
   propio: quedan tantos como alcancen sus partes, y al venderlo la planilla (Versión 26) descuenta cada parte con un
   ajuste «PACK <venta>: …». Si todas las partes son ropa, el pack es una prenda única (VENDIDO 15 días). */
function esPack(p){ return !!(p && p.ext && p.ext.pack && p.ext.pack.length); }
function partesPack(p){ return esPack(p) ? p.ext.pack.map(function(c){ return { p:prod(c.id), c:Number(c.c) || 1 }; }) : []; }
function stockPack(p){ var m = Infinity; partesPack(p).forEach(function(x){ m = Math.min(m, x.p && x.p.activo ? Math.floor(x.p.stock / x.c) : 0); }); return isFinite(m) ? m : 0; }
/* Foto de un pack: las fotos de todas sus partes juntas (27-10-2026, la dueña: "solo me aparece la polera, no el short"). */
function phHtml(p){
 var fs = esPack(p) ? partesPack(p).filter(function(x){ return x.p && x.p.foto; }).map(function(x){ return x.p.foto; }) : [];
 if(fs.length > 1) return '<div class="ph-pack n' + Math.min(fs.length, 4) + '">' + fs.slice(0, 4).map(function(f){ return '<img src="' + esc(fotoUrl(f)) + '" alt="">'; }).join("") + '</div>';
 return p.foto ? '<img src="' + esc(fotoUrl(p.foto)) + '" alt="">' : iconoCat(p.cat);
}
function esUnica(p){ if(esPack(p)) return partesPack(p).every(function(x){ return x.p && esRopa(x.p); }); return esRopa(p); }
function descontar(id, cant){ var q = prod(id); if(!q) return; if(esPack(q)) partesPack(q).forEach(function(x){ if(x.p) x.p.stock -= cant * x.c; }); else q.stock -= cant; }
/* 🚀 Precio de lanzamiento (27-10-2026, la dueña eligió la idea 26): ext.lanz = { hasta, precio }; hasta esa fecha se
   vende a ese precio y en la vitrina sale «NUEVO» con el precio normal tachado. */
function lanzDe(p){ var l = p && p.ext && p.ext.lanz; return l && l.hasta >= (S.hoy || hoyISO()) && Number(l.precio) > 0 && Number(l.precio) < p.precio ? l : null; }
function precioVenta(p){ var l = lanzDe(p); return l ? Number(l.precio) : p.precio; }
/* 💪 «+ Creatina» en los batidos (misma fecha): suma CREATINA_EXTRA al precio de esa línea. */
var CREATINA_EXTRA = 1000;
function esBatido(p){ return !!p && /^batido/i.test(p.n || ""); }
/* 📌 Apartados (27-10-2026, la dueña eligió la idea 9): «Apartar» guarda en la planilla un ajuste de −1 con la nota
   «APARTADO #tok: NOMBRE · hasta AAAA-MM-DD HH:MM» (así nadie más lo vende y los dos equipos lo ven, sin cambiar el
   Apps Script). «Liberar» o el vencimiento anotan +1 «LIBERADO #tok»; «Retiró y pagó» lo pasa a la venta y al cobrar
   anota +1 «RETIRADO #tok» justo antes de la venta (el stock queda igual que si se hubiera vendido directo). */
var HORAS_APARTADO = [24, 48, 72];
/* Snacks y bebestibles (aguas, latas) no se apartan (la dueña, 27-10-2026: "en todo menos en los snack y las aguas"). */
var SIN_APARTAR = ["Snacks", "Bebestibles"];
function sePuedeApartar(p){ return SIN_APARTAR.indexOf(catNueva(p.cat)) < 0 && !esPack(p); }
function fmtCL(ms){ return new Intl.DateTimeFormat("sv-SE", { timeZone:"America/Santiago", year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit" }).format(new Date(ms)).replace("T", " ").slice(0, 16); }
function apartados(){
 var a = {}, fin = {};
 todosMovs().forEach(function(m){ if(m.tipo !== "ajuste" || !m.nota) return;
  var r = /^APARTADO #(\w+): (.*) · hasta (\d{4}-\d{2}-\d{2} \d{2}:\d{2})/.exec(m.nota);
  if(r){ a[r[1]] = { tok:r[1], id:m.id, nombre:r[2], hasta:r[3] }; return; }
  var r2 = /^(LIBERADO|RETIRADO) #(\w+)/.exec(m.nota); if(r2) fin[r2[2]] = 1; });
 carro.forEach(function(it){ if(it.apt) fin[it.apt] = 1; });
 return Object.keys(a).filter(function(k){ return !fin[k] && prod(a[k].id); }).map(function(k){ return a[k]; });
}
function apartadoDe(p){ return apartados().filter(function(x){ return x.id === p.id; })[0] || null; }
function aptVencido(x){ return x.hasta <= ahoraTxt(); }
function aptHasta(x){ return x.hasta.slice(8, 10) + "/" + x.hasta.slice(5, 7) + " " + x.hasta.slice(11, 16); }
function moverApartado(id, cant, nota){ var q = prod(id); if(q) q.stock += cant; pend.push({ tipo:"entrada", f:ahoraTxt(), datos:{ id:id, cant:cant, tipo:"ajuste", nota:nota } }); }
function formApartar(p){
 var horas = 48;
 function pintar(){
  abrirHoja('<div class="cab"><h3>📌 Apartar</h3><button class="btn chico volver" id="aCerrar">← Volver</button></div><p style="font-size:19px;text-transform:uppercase;margin:8px 0">' + esc(p.n) + (p.det ? ' · <span class="muted">' + esc(p.det) + '</span>' : '') + '</p>' +
   '<label class="lab" for="aNom">¿Para quién? (nombre y apellido)</label><input class="inp" id="aNom" placeholder="Ej: Juan Pérez" autocomplete="off">' +
   '<label class="lab">¿Por cuánto tiempo?</label><div class="chips">' + HORAS_APARTADO.map(function(h){ return '<button class="chip" data-h="' + h + '" aria-pressed="' + (h === horas) + '">' + h + ' horas</button>'; }).join("") + '</div>' +
   '<p class="muted" style="font-size:15px">Mientras esté apartado nadie más lo puede comprar. Si no lo retira a tiempo, vuelve solo a la venta.</p>' +
   '<p class="err" id="aErr" hidden></p><button class="btn rojo" id="aOk" style="margin-top:12px">📌 Apartar</button>');
  $("aCerrar").onclick = cerrarHoja;
  document.querySelectorAll("[data-h]").forEach(function(b){ b.onclick = function(){ var v = $("aNom").value; horas = +b.dataset.h; pintar(); $("aNom").value = v; }; });
  $("aOk").onclick = function(){
   var nom = ($("aNom").value || "").trim().toUpperCase().replace(/[·#]/g, " ");
   if(!nom){ $("aErr").hidden = false; $("aErr").textContent = "Escribe para quién es."; return; }
   if(stockVer(p) <= 0){ $("aErr").hidden = false; $("aErr").textContent = "No queda stock para apartar."; return; }
   var tok = "A" + Date.now().toString(36).toUpperCase();
   moverApartado(p.id, -1, "APARTADO #" + tok + ": " + nom + " · hasta " + fmtCL(Date.now() + horas * 3600000));
   lsSet(CLAVE_PEND, pend); guardarCache(); cerrarHoja(); render(); toast("📌 Apartado para " + nom); enviarPendientes();
  };
 }
 pintar();
}
function liberarApartado(x, motivo){
 moverApartado(x.id, 1, "LIBERADO #" + x.tok + (motivo ? " (" + motivo + ")" : ""));
 lsSet(CLAVE_PEND, pend); guardarCache();
}
function retiroApartado(x){
 var p = prod(x.id); if(!p) return;
 carro.push({ id:p.id, n:p.n, precio:precioVenta(p), cant:1, apt:x.tok, aptNom:x.nombre });
 cerrarHoja(); document.querySelector('#nav [data-tab="vender"]').click(); toast("Ahora cobra la venta");
}
/* Los vencidos vuelven solos a la venta: antes de liberar se vuelve a pedir la planilla, para que si el otro equipo
   ya lo liberó no se sume dos veces. */
var revisandoApt = false;
function revisarApartados(){
 if(revisandoApt || !apartados().some(aptVencido)) return;
 revisandoApt = true;
 api("tiendaListar", {}).then(function(d){
  S.movs = d.movs || S.movs; S.productos = d.productos || S.productos; aplicarPendientes();
  var v = apartados().filter(aptVencido);
  v.forEach(function(x){ liberarApartado(x, "venció"); });
  if(v.length){ toast("↩ Volvió a la venta: " + v.map(function(x){ return (prod(x.id) || {}).n; }).join(", "), 5000); render(); return enviarPendientes(); }
 })["catch"](function(){})["finally"](function(){ revisandoApt = false; });
}
function verApartados(){
 var l = apartados();
 abrirHoja('<div class="cab"><h3>📌 Apartados</h3><button class="btn chico volver" id="vaCerrar">← Volver</button></div>' +
  (l.length ? l.map(function(x){ var p = prod(x.id);
   return '<div class="card"><div class="prod"><div class="ph">' + (p.foto ? '<img src="' + esc(fotoUrl(p.foto)) + '" alt="">' : iconoCat(p.cat)) + '</div><div class="tx"><b>' + esc(p.n) + '</b><span>' + esc(p.det || p.cat) + '</span></div></div>' +
    '<p style="margin:8px 0 0;font-size:17px">Para <b>' + esc(x.nombre) + '</b> · ' + (aptVencido(x) ? '<b style="color:#FF8A8F">⏰ se le pasó la hora</b>' : 'hasta ' + aptHasta(x)) + '</p>' +
    '<div class="grid2" style="margin-top:8px"><button class="btn chico verde" style="width:100%" data-ret="' + x.tok + '">💵 Retiró y pagó</button><button class="btn chico" style="width:100%" data-lib="' + x.tok + '">↩ Liberar</button></div></div>'; }).join("")
  : '<div class="card"><p style="margin:0">No hay nada apartado.</p></div>'));
 $("vaCerrar").onclick = cerrarHoja;
 enlazarApartados(verApartados);
}
function enlazarApartados(despues){
 document.querySelectorAll("[data-ret]").forEach(function(b){ b.onclick = function(){ var x = apartados().filter(function(a){ return a.tok === b.dataset.ret; })[0]; if(x) retiroApartado(x); }; });
 document.querySelectorAll("[data-lib]").forEach(function(b){ b.onclick = function(){ var x = apartados().filter(function(a){ return a.tok === b.dataset.lib; })[0]; if(!x || !confirm("¿Liberar el apartado de " + x.nombre + "? Vuelve a la venta.")) return; liberarApartado(x, "a mano"); render(); toast("↩ Vuelve a la venta"); enviarPendientes(); if(despues) despues(); }; });
 document.querySelectorAll("[data-apt]").forEach(function(b){ b.onclick = function(){ formApartar(prod(b.dataset.apt)); }; });
}
function ajustePorciones(vid, items, signo, nota){
 items.forEach(function(it){ var q = prod(it.id), b = basePorcion(q); if(!b) return;
  pend.push({ tipo:"entrada", f:ahoraTxt(), datos:{ id:b.id, cant:signo * it.cant, tipo:"ajuste", nota:nota + " " + q.n + " (" + vid + ")" } });
  b.stock += signo * it.cant; });
}
function pintarSync(estado){
 var el = $("sync"); el.className = "";
 if(estado === "cargando"){ el.textContent = "⏳ Actualizando…"; return; }
 if(pend.length){ el.className = "pend"; el.textContent = "⏳ " + pend.length + " por enviar"; return; }
 if(estado === "error"){ el.className = "err"; el.textContent = "⚠️ Sin conexión"; return; }
 el.textContent = "✅ Al día";
}
function cargar(silencioso){
 if(!silencioso) pintarSync("cargando");
 return api("tiendaListar", {}).then(function(d){
  S = { productos:d.productos || [], movs:d.movs || [], total:d.total || {}, hoy:d.hoy || hoyISO(), desde:d.desde, v:d.v || 24, cierres:d.cierres || [], gastos:d.gastos || [] };
  aplicarPendientes(); repararCodificados(); guardarCache(); pintarSync(); render(); revisarApartados(); return true;
 })["catch"](function(e){
  if(e.motivo === "clave incorrecta"){ salir("La clave guardada no funcionó. Escríbela de nuevo."); return false; }
  if(/action|desconocid|no existe/i.test(e.message || "")){ pintarSync("error"); avisoScript(); return false; }
  pintarSync("error"); return false;
 });
}
var avisado = false;
function avisoScript(){ if(avisado) return; avisado = true; toast("Falta instalar la Versión 24 del Apps Script para guardar en la planilla.", 6000); }
/* Envía lo pendiente de a uno, en orden. Una venta repetida (ya había llegado) la planilla la ignora. */
var enviando = false;
function enviarPendientes(){
 if(enviando || !pend.length) { pintarSync(); return Promise.resolve(); }
 enviando = true; pintarSync();
 var p = pend[0], accion = p.tipo === "venta" ? "tiendaVenta" : p.tipo === "abono" ? "tiendaAbono" : "tiendaEntrada";
 return api(accion, { datos:JSON.stringify(p.datos) }).then(function(d){
  pend.shift(); lsSet(CLAVE_PEND, pend); enviando = false;
  if(!pend.length) return cargar(true);
  return enviarPendientes();
 })["catch"](function(e){
  enviando = false;
  if(e.motivo === "producto no encontrado" || e.motivo === "productos no encontrados" || e.motivo === "cantidad inválida" || e.motivo === "fiado no encontrado"){ pend.shift(); lsSet(CLAVE_PEND, pend); toast("⚠️ Se descartó un movimiento: " + e.motivo, 5000); return enviarPendientes(); }
  pintarSync("error");
 });
}

/* Todo se actualiza solo (24-10-2026, la dueña: "la idea es que si hago una modificación en el celular se cambie igual en

  x.restore();

  /* Franja de abajo con los dos WhatsApp. */
  x.textAlign = "center";
  x.fillStyle = "#D4AF37"; x.fillRect(0, H - bar - 8, W, 8);

function redondo(x, a, b, w, h, r){ x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); }

/* Foto del código (24-10-2026, la dueña: "no me escanea cuando la botella está parada"): la cámara del teléfono
   enfoca sola y la foto quieta se lee acostada y parada (mismo lector que WGYMNUTRI). */
function leerFotoCodigo(file){
 return new Promise(function(ok){
  var url = URL.createObjectURL(file), img = new Image();
  img.onerror = function(){ URL.revokeObjectURL(url); ok(null); };
  img.onload = function(){
   var lienzos = [0, 90].map(function(giro){
    var e = Math.min(1, 1600 / Math.max(img.width, img.height)), w = Math.round(img.width * e), h = Math.round(img.height * e);
    var cv = document.createElement("canvas"), cx = cv.getContext("2d");
    if(giro){ cv.width = h; cv.height = w; cx.translate(h, 0); cx.rotate(Math.PI / 2); } else { cv.width = w; cv.height = h; }
    cx.drawImage(img, 0, 0, w, h); return cv;
   });
   URL.revokeObjectURL(url);
   var nat = ("BarcodeDetector" in window) ? new BarcodeDetector({ formats:["ean_13","ean_8","upc_a","upc_e"] }).detect(lienzos[0]).then(function(r){ return r && r[0] ? r[0].rawValue : null; })["catch"](function(){ return null; }) : Promise.resolve(null);
   nat.then(function(code){
    if(code) return ok(code);
    cargarZXing().then(function(){
     var hints = new Map(); hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E, ZXing.BarcodeFormat.CODE_128]); hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
     var lector = new ZXing.MultiFormatReader(); lector.setHints(hints);
     for(var i = 0; i < lienzos.length; i++){ try{ var r = lector.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(lienzos[i]))), hints); if(r) return ok(r.getText()); }catch(e){} }
     ok(null);
    })["catch"](function(){ ok(null); });
   });
  };
  img.src = url;
 });
}
function botonFotoCodigo(id){ return '<label class="btn oro" for="' + id + '" style="display:block;text-align:center;margin:10px 0">📸 ¿No lo lee? Saca una foto del código</label><input type="file" id="' + id + '" accept="image/*" capture="environment" hidden>'; }
function usarFotoCodigo(input, alLeer){
 input.onchange = function(){ var f = input.files && input.files[0]; input.value = ""; if(!f) return; toast("Leyendo la foto…");
  leerFotoCodigo(f).then(function(code){ if(code) alLeer(code); else toast("No se ve el código en la foto. Acércate más, con buena luz, y que salga entero."); }); };
}
/* Escáner para vender: queda abierto y suma cada producto que lee (con 2 s de pausa entre el mismo código). */
function abrirEscaner(alLeer, seguido){

  '<div class="cam" style="margin-top:10px"><video id="cVid" playsinline muted autoplay></video><div class="marco"></div><div class="laser"></div><div class="flash" id="cFlash"></div></div>' +
  '<p class="muted" id="cTxt" style="text-align:center;margin:10px 0">' + (seguido ? 'Apunta al código de barras. Puedes escanear varios productos seguidos.' : 'Apunta al código de un producto. Se suma 1 y se cierra solo.') + '<br>Si el código está parado, gira el teléfono de lado.</p>' +
  botonFotoCodigo("cFoto") +
  '<div class="fila"><input class="inp" id="cMan" inputmode="numeric" placeholder="¿No lee? Escribe el número"><button class="btn chico" id="cManOk" style="flex:none">OK</button></div><div id="cNuevo"></div>');
 var ultimo = { c:"", t:0 };
 function cuenta(){ var c = $("cCuenta"); if(!c) return; var n = carro.reduce(function(s, it){ return s + it.cant; }, 0);
  c.textContent = n ? "🧾 En la venta: " + n + (n === 1 ? " producto" : " productos") + " · " + plata(totalCarro()) : "🧾 La venta está vacía"; }
 cuenta();
 function leer(code){
  var ahora = Date.now(); if(code === ultimo.c && ahora - ultimo.t < 2000) return; ultimo = { c:code, t:ahora };
  bip(); vibrar(60);
  var msg = alLeer(code), fl = $("cFlash"); cuenta();
  if(msg){ fl.style.background = "rgba(31,168,86,.95)"; fl.textContent = msg; fl.style.display = "block"; clearTimeout(leer.t); leer.t = setTimeout(function(){ if($("cFlash")) $("cFlash").style.display = "none"; }, 1500); $("cNuevo").innerHTML = ""; }
  else { fl.style.background = "rgba(227,6,19,.95)"; fl.textContent = "Código " + code + " no está en tu inventario"; fl.style.display = "block";

}
/* Escáner de una sola lectura (para llenar el código al crear un producto). */

/* ═══ Enlace con la ficha ya llena (24-10-2026, la dueña: "quiero que todos los productos que te empiece a mandar

var ENLACE = null;

  (!b.n && b.foto ? activos().filter(function(p){ return p.foto === b.foto; })[0] : null);

  if(b.tipo) cambio.ext = Object.assign({}, ya.ext || {}, { tipo:b.tipo === "americana" ? "americana" : "nueva" });
