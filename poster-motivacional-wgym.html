<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WGYMADNSPORT - Poster Motivacional</title>
    <link rel="stylesheet" href="https://use.typekit.net/kpz5eau.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: "source-han-sans-cjk-ja", sans-serif;
        }

        .poster-container {
            width: 100%;
            height: 100%;
            aspect-ratio: 16 / 9;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a0a 50%, #0a0a0a 100%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Neon red accent lights */
        .neon-glow-1 {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 0, 64, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            top: -100px;
            right: -150px;
            filter: blur(80px);
            animation: glow-pulse 4s ease-in-out infinite;
        }

        .neon-glow-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 0, 64, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -100px;
            left: -100px;
            filter: blur(80px);
            animation: glow-pulse 6s ease-in-out infinite reverse;
        }

        @keyframes glow-pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        /* Background figure silhouette */
        .figure-container {
            position: absolute;
            right: -50px;
            bottom: -50px;
            width: 600px;
            height: 600px;
            z-index: 1;
        }

        /* Logo W */
        .logo-container {
            position: absolute;
            top: 40px;
            left: 40px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .w-logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #FFFFFF 0%, #F0F0F0 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "anton", sans-serif;
            font-size: 48px;
            font-weight: bold;
            color: #000;
            box-shadow: 0 0 30px rgba(255, 0, 64, 0.4);
            position: relative;
        }

        .w-logo::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 0, 64, 0.2) 0%, transparent 60%);
            border-radius: 50%;
        }

        .logo-text {
            font-family: "source-han-sans-cjk-ja", sans-serif;
            color: #FFFFFF;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            line-height: 1.2;
            text-transform: uppercase;
        }

        /* Main content */
        .content {
            position: relative;
            z-index: 5;
            text-align: center;
            color: #FFFFFF;
            padding: 0 60px;
            max-width: 90%;
        }

        .main-text {
            font-family: "anton", sans-serif;
            font-size: 72px;
            line-height: 1.15;
            font-weight: 900;
            color: #FFD700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
            text-shadow:
                0 0 20px rgba(255, 0, 64, 0.5),
                0 4px 20px rgba(0, 0, 0, 0.8);
            word-spacing: 100vw;
        }

        .main-text span {
            display: inline-block;
            word-spacing: normal;
        }

        .divider {
            width: 200px;
            height: 3px;
            background: linear-gradient(90deg, #FF0040, #FFD700, #FF0040);
            margin: 20px auto;
            box-shadow: 0 0 15px rgba(255, 0, 64, 0.6);
        }

        .subtitle {
            font-family: "source-han-sans-cjk-ja", sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 30px;
            opacity: 0.95;
        }

        /* Footer brand */
        .footer {
            position: absolute;
            bottom: 30px;
            right: 40px;
            z-index: 10;
            text-align: right;
        }

        .brand-footer {
            font-family: "anton", sans-serif;
            font-size: 20px;
            color: #FFD700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(255, 0, 64, 0.4);
        }

        .date-footer {
            font-family: "source-han-sans-cjk-ja", sans-serif;
            font-size: 14px;
            color: #FFFFFF;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        /* SVG figure - muscular back silhouette */
        .figure-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 30px rgba(255, 0, 64, 0.3));
        }

        /* Responsive adjustments */
        @media (max-width: 1200px) {
            .main-text {
                font-size: 56px;
            }

            .subtitle {
                font-size: 20px;
            }
        }

        @media (max-width: 768px) {
            .main-text {
                font-size: 40px;
            }

            .subtitle {
                font-size: 16px;
            }

            .logo-container {
                top: 20px;
                left: 20px;
            }

            .w-logo {
                width: 60px;
                height: 60px;
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="poster-container">
        <!-- Neon glow effects -->
        <div class="neon-glow-1"></div>
        <div class="neon-glow-2"></div>

        <!-- Background muscular figure silhouette -->
        <div class="figure-container">
            <svg class="figure-svg" viewBox="0 0 500 600" xmlns="http://www.w3.org/2000/svg">
                <!-- Muscular back silhouette -->
                <defs>
                    <linearGradient id="muscleGradient" x1="0%" y1="0%" x2="100%">
                        <stop offset="0%" style="stop-color:#FF0040;stop-opacity:0.15" />
                        <stop offset="50%" style="stop-color:#FF0040;stop-opacity:0.05" />
                        <stop offset="100%" style="stop-color:#FF0040;stop-opacity:0.15" />
                    </linearGradient>
                </defs>

                <!-- Head -->
                <circle cx="250" cy="80" r="45" fill="#333333" opacity="0.7"/>

                <!-- Neck -->
                <path d="M 235 125 Q 230 160 240 190 L 260 190 Q 270 160 265 125 Z" fill="#333333" opacity="0.7"/>

                <!-- Upper back and shoulders -->
                <path d="M 100 200 Q 80 220 85 280 Q 90 320 120 350 L 130 360 Q 150 330 180 320 L 200 310 L 220 300 L 250 295 L 280 300 L 300 310 L 320 320 Q 350 330 370 360 L 380 350 Q 410 320 415 280 Q 420 220 400 200 Z"
                      fill="url(#muscleGradient)" stroke="#FF0040" stroke-width="1" opacity="0.8"/>

                <!-- Trapezius muscles -->
                <path d="M 180 250 Q 160 240 150 280 Q 145 310 170 330 L 200 310 Z" fill="#FF0040" opacity="0.2"/>
                <path d="M 320 250 Q 340 240 350 280 Q 355 310 330 330 L 300 310 Z" fill="#FF0040" opacity="0.2"/>

                <!-- Lat muscles definition -->
                <path d="M 120 300 Q 90 350 100 420 L 140 400 Q 130 350 140 300 Z" fill="#FF0040" opacity="0.15"/>
                <path d="M 380 300 Q 410 350 400 420 L 360 400 Q 370 350 360 300 Z" fill="#FF0040" opacity="0.15"/>

                <!-- Central back muscles -->
                <ellipse cx="250" cy="340" rx="60" ry="80" fill="#FF0040" opacity="0.1"/>

                <!-- Lower back definition -->
                <path d="M 200 380 Q 240 390 280 380 L 270 420 Q 250 430 230 420 Z" fill="#FF0040" opacity="0.15"/>

                <!-- Arms raised showing biceps -->
                <!-- Left arm -->
                <path d="M 120 260 Q 60 200 40 120 Q 35 80 50 50"
                      stroke="#333333" stroke-width="45" fill="none" stroke-linecap="round" opacity="0.7"/>
                <ellipse cx="70" cy="200" rx="30" ry="45" fill="#FF0040" opacity="0.2"/>

                <!-- Right arm -->
                <path d="M 380 260 Q 440 200 460 120 Q 465 80 450 50"
                      stroke="#333333" stroke-width="45" fill="none" stroke-linecap="round" opacity="0.7"/>
                <ellipse cx="430" cy="200" rx="30" ry="45" fill="#FF0040" opacity="0.2"/>

                <!-- Abdominal definition hint -->
                <line x1="240" y1="340" x2="240" y2="420" stroke="#FF0040" stroke-width="2" opacity="0.3"/>
                <line x1="260" y1="340" x2="260" y2="420" stroke="#FF0040" stroke-width="2" opacity="0.3"/>

                <!-- Glowing outline for dramatic effect -->
                <path d="M 100 200 Q 80 220 85 280 Q 90 320 120 350 L 130 360 Q 150 330 180 320 L 200 310 L 220 300 L 250 295 L 280 300 L 300 310 L 320 320 Q 350 330 370 360 L 380 350 Q 410 320 415 280 Q 420 220 400 200 Z"
                      fill="none" stroke="#FF0040" stroke-width="2" opacity="0.4"/>
            </svg>
        </div>

        <!-- Logo section -->
        <div class="logo-container">
            <div class="w-logo">W</div>
            <div class="logo-text">ADN</div>
        </div>

        <!-- Main content -->
        <div class="content">
            <div class="main-text">
                <span>EL CARDIO TE DA MÁS AÑOS DE VIDA.</span><br>
                <span>LAS PESAS TE DAN MÁS VIDA EN ESOS AÑOS.</span>
            </div>
            <div class="divider"></div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="brand-footer">WGYMADNSPORT</div>
            <div class="date-footer">21 DE MAYO • 1520</div>
        </div>
    </div>
</body>
</html>
