<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>WGYMADNSPORT · Pase VIP Socio Nuevo — Hoja A4 x10</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ background:#E7E7E3; }
  body{
    font-family:Arial, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:24px;
    padding:24px 16px 60px;
  }
  .label{
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#8B8E92;
    font-size:12px;
  }
  .sheet{
    width:29.7cm;
    height:21cm;
    background:#fff;
    box-shadow:0 12px 30px -12px rgba(0,0,0,.35);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(5, 4.5cm);
    grid-template-rows:repeat(2, 8.3cm);
    column-gap:0.4cm;
    row-gap:0.4cm;
  }
  .card-box{
    width:4.5cm;
    height:8.3cm;
    outline:1px dashed #9a9a9a;
    outline-offset:-1px;
    overflow:hidden;
  }
  .card-box img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  @media print{
    html,body{ background:#fff; padding:0; margin:0; gap:0; }
    .label{ display:none; }
    .sheet{ box-shadow:none; page-break-after:always; }
    .sheet:last-child{ page-break-after:auto; }
    @page{ size: A4 landscape; margin:0; }
  }
</style>
</head>
